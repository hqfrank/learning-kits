<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="649" viewBox="0 0 1460 649"><rect x="0" y="0" width="1460" height="649" fill="#ffffff"/><defs></defs><polyline points="230.0,434.0 1070.0,434.0" fill="none" stroke="#444444" stroke-width="1.2"/><polyline points="230.0,434.0 230.0,440.0" fill="none" stroke="#444444" stroke-width="1.2"/><polyline points="370.0,434.0 370.0,440.0" fill="none" stroke="#444444" stroke-width="1.2"/><polyline points="510.0,434.0 510.0,440.0" fill="none" stroke="#444444" stroke-width="1.2"/><polyline points="650.0,434.0 650.0,440.0" fill="none" stroke="#444444" stroke-width="1.2"/><polyline points="790.0,434.0 790.0,440.0" fill="none" stroke="#444444" stroke-width="1.2"/><polyline points="930.0,434.0 930.0,440.0" fill="none" stroke="#444444" stroke-width="1.2"/><polyline points="1070.0,434.0 1070.0,440.0" fill="none" stroke="#444444" stroke-width="1.2"/><rect x="20" y="12" width="1420" height="60" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1420" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1420px;height:60px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:20px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">The object detector's frame: from alone to the full stack it grows mostly by CPU terms (run-queue wait + slower run); from the full stack to full stack + VLA it grows mostly by GPU-blocked time</div></div></foreignObject><rect x="14" y="84" width="206" height="64" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="14" y="84" width="206" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:206px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:right;overflow:hidden;"><div style="width:100%;"><b>Alone</b><br/>[detector_frame_ms_solo_full, illustrative]</div></div></foreignObject><rect x="14" y="194" width="206" height="64" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="14" y="194" width="206" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:206px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:right;overflow:hidden;"><div style="width:100%;"><b>Full stack</b><br/>[detector_added_wait_run_blocked, illustrative]</div></div></foreignObject><rect x="14" y="304" width="206" height="64" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="14" y="304" width="206" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:206px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:right;overflow:hidden;"><div style="width:100%;"><b>Full stack + VLA</b><br/>[detector_vla_added_blocked_wait_run, illustrative]</div></div></foreignObject><rect x="230.0" y="84" width="280.0" height="64" rx="0" fill="#e4e4e4" stroke="#888888" stroke-width="1.5"/><foreignObject x="230.0" y="84" width="280.0" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:280.0px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">alone frame 100 ms<br/>(alone frame not split)</div></div></foreignObject><rect x="230.0" y="194" width="280.0" height="64" rx="0" fill="#e4e4e4" stroke="#888888" stroke-width="1.5"/><foreignObject x="230.0" y="194" width="280.0" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:280.0px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">alone frame 100 ms</div></div></foreignObject><rect x="510.0" y="194" width="140.0" height="64" rx="0" fill="#9fc0e8" stroke="#2f5d9a" stroke-width="1.5"/><foreignObject x="510.0" y="194" width="140.0" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:140.0px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">+50<br/>wait</div></div></foreignObject><rect x="650.0" y="194" width="84.0" height="64" rx="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="5,3"/><foreignObject x="650.0" y="194" width="84.0" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:84.0px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">+30<br/>run</div></div></foreignObject><rect x="734.0" y="194" width="56.0" height="64" rx="0" fill="#b9dfb0" stroke="#3f7f33" stroke-width="1.5"/><foreignObject x="734.0" y="194" width="56.0" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:56.0px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">+20<br/>blocked</div></div></foreignObject><rect x="796.0" y="214" width="120" height="24" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="796.0" y="214" width="120" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:120px;height:24px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">= <b>200 ms</b></div></div></foreignObject><rect x="230.0" y="304" width="560.0" height="64" rx="0" fill="#e4e4e4" stroke="#888888" stroke-width="1.5"/><foreignObject x="230.0" y="304" width="560.0" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:560.0px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">full-stack frame 200 ms</div></div></foreignObject><rect x="790.0" y="304" width="196.0" height="64" rx="0" fill="#b9dfb0" stroke="#3f7f33" stroke-width="1.5"/><foreignObject x="790.0" y="304" width="196.0" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:196.0px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">+70<br/>blocked</div></div></foreignObject><rect x="986.0" y="304" width="56.0" height="64" rx="0" fill="#9fc0e8" stroke="#2f5d9a" stroke-width="1.5"/><foreignObject x="986.0" y="304" width="56.0" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:56.0px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">+20<br/>wait</div></div></foreignObject><rect x="1042.0" y="304" width="28.0" height="64" rx="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="5,3"/><foreignObject x="1042.0" y="304" width="28.0" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:28.0px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">+10<br/>run</div></div></foreignObject><rect x="470.0" y="374" width="606" height="36" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="470.0" y="374" width="606" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:606px;height:36px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:right;overflow:hidden;"><div style="width:100%;">= about <b>300 ms</b> (my estimate from `detector_frame_ms_solo_full` and `detector_vla_added_blocked_wait_run`)</div></div></foreignObject><rect x="210.0" y="441" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="210.0" y="441" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">0</div></div></foreignObject><rect x="350.0" y="441" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="350.0" y="441" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">50</div></div></foreignObject><rect x="490.0" y="441" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="490.0" y="441" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">100</div></div></foreignObject><rect x="630.0" y="441" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="630.0" y="441" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">150</div></div></foreignObject><rect x="770.0" y="441" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="770.0" y="441" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">200</div></div></foreignObject><rect x="910.0" y="441" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="910.0" y="441" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">250</div></div></foreignObject><rect x="1050.0" y="441" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="1050.0" y="441" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">300</div></div></foreignObject><rect x="230" y="458" width="840.0" height="18" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="230" y="458" width="840.0" height="18"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:840.0px;height:18px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:2px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ms per frame (the detector's own per-frame log, split by the inventory script)</div></div></foreignObject><rect x="1110" y="186" width="330" height="80" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="1110" y="186" width="330" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:330px;height:80px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>alone -&gt; full stack: mostly CPU.</b> Wait + run = 80 of +100 ms added; wait alone = 0.5 of it (my estimate from `detector_added_wait_run_blocked`). Clocks locked, so not frequency.</div></div></foreignObject><rect x="1110" y="296" width="330" height="80" rx="6" fill="#d5e8d4" stroke="#5f9e4f" stroke-width="1.5"/><foreignObject x="1110" y="296" width="330" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:330px;height:80px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>full stack -&gt; + VLA: mostly GPU.</b> Blocked +70 of +100 ms added = 0.7 (my estimate from `detector_vla_added_blocked_wait_run`): GPU time-slicing between CUDA contexts (page 05).</div></div></foreignObject><rect x="30" y="492" width="450" height="74" rx="6" fill="#f3ecf7" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="6,4"/><foreignObject x="30" y="492" width="450" height="74"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:450px;height:74px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>Correction kept visible.</b> Step 1 first said the pool changes from the full stack to full stack + VLA were "within round-to-round spread". Withdrawn: one full stack + VLA round had no speech in its window. With voice on in both, pool wait rises. The GPU step is still the larger change.</div></div></foreignObject><rect x="495" y="492" width="480" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><foreignObject x="495" y="492" width="480" height="74"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:480px;height:74px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>Caveats.</b> "Blocked" = neither running nor waiting for a CPU (mostly GPU sync; also locks, I/O). The GPU mechanism was tested in a camera-plus-detector row with an idle pool; in the full stack it is expected, not tested (note B1). The + VLA total is my sum of the added terms.</div></div></foreignObject><rect x="990" y="492" width="450" height="74" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1.5"/><foreignObject x="990" y="492" width="450" height="74"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:450px;height:74px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>What each term means.</b> Wait = runnable, no free pool core (note A1, page 02). Added run = the same instructions needing more cycles (note A2, page 04). Blocked next to the VLA = waiting for other contexts' GPU turns (note B1, page 05).</div></div></foreignObject><rect x="30" y="578" width="600" height="55" rx="0" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.5"/><foreignObject x="30" y="578" width="600" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:55px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>Legend</b> grey = the previous level's frame; mid-blue, solid border = added run-queue wait (CPU); light blue, dashed border = added run time (CPU); green, solid border = added blocked time (mostly GPU sync); every term is also named in its bar. Bar lengths to scale (2.8 px per ms).</div></div></foreignObject><rect x="645" y="578" width="795" height="53" rx="0" fill="#fff8dc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="645" y="578" width="795" height="53"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:795px;height:53px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>Sources.</b> Numbers loaded from ../constants.json by spec03.py; key in brackets. Notes A1 (per-frame decomposition, correction), B1 (the rise next to the VLA).<br/><b>Illustrative</b> (round teaching numbers that keep the shape of a finding; not measurements): detector_frame_ms_solo_full, detector_added_wait_run_blocked, detector_vla_added_blocked_wait_run.</div></div></foreignObject></svg>