<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent; color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="925px" height="647px" viewBox="0 0 925 647"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="t"><g><rect x="-0.4" y="0" width="860" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="429.6" y="19">The L2 capacity cliff: a working set that fits L2 streams 12.4× (Orin) / 14.6× (Thor) faster than one that spills to DRAM</text></g></g></g><g data-cell-id="s"><g><rect x="-0.4" y="22" width="860" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" text-anchor="middle" font-size="9px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="429.6" y="37">Streaming read bandwidth vs footprint. The cliff falls exactly at each board's L2 size (4 MB Orin, 32 MB Thor). Latency shelves (right) show L2 ~150 ns on both — only capacity grew, not speed.</text></g></g></g><g data-cell-id="ay"><g><path d="M 89.6 434 L 89.6 64" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(0, 0, 0), rgb(237, 237, 237));"/></g></g><g data-cell-id="ax"><g><path d="M 89.6 434 L 749.6 434" fill="none" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(0, 0, 0), rgb(237, 237, 237));"/></g></g><g data-cell-id="aylab"><g><rect x="19.6" y="144" width="24" height="240" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" transform="rotate(-90,26.6,264)" font-size="10px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="26.6" y="273">Streaming read bandwidth (GB/s, log)</text></g></g></g><g data-cell-id="axlab"><g><rect x="539.6" y="442" width="210" height="16" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="644.6" y="458">Working-set footprint (MB, log scale)</text></g></g></g><g data-cell-id="x1"><g><rect x="79.6" y="436" width="20" height="12" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="9px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="89.6" y="451">1</text></g></g></g><g data-cell-id="x4"><g><rect x="224.6" y="436" width="60" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2a4d7a" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="9px" style="fill: light-dark(rgb(42, 77, 122), rgb(148, 178, 217));"><text x="254.6" y="451">4 MB (Orin L2)</text></g></g></g><g data-cell-id="x32"><g><rect x="472.6" y="436" width="60" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2d6a2d" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="9px" style="fill: light-dark(rgb(45, 106, 45), rgb(124, 176, 124));"><text x="502.6" y="451">32 MB (Thor L2)</text></g></g></g><g data-cell-id="x256"><g><rect x="729.6" y="436" width="30" height="12" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="9px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="744.6" y="451">256</text></g></g></g><g data-cell-id="yb100"><g><rect x="57.6" y="428" width="26" height="12" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="end" font-size="9px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="81.6" y="443">100</text></g></g></g><g data-cell-id="yb1000"><g><rect x="53.6" y="318" width="30" height="12" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="end" font-size="9px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="81.6" y="333">1000</text></g></g></g><g data-cell-id="yb4000"><g><rect x="53.6" y="252" width="30" height="12" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="end" font-size="9px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="81.6" y="267">4000</text></g></g></g><g data-cell-id="cliffO"><g transform="translate(0.5,0.5)"><path d="M 254.6 434 L 254.6 74" fill="none" stroke="#2a4d7a" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: light-dark(rgb(42, 77, 122), rgb(148, 178, 217));"/></g></g><g data-cell-id="cliffT"><g transform="translate(0.5,0.5)"><path d="M 502.6 434 L 502.6 74" fill="none" stroke="#2d6a2d" stroke-miterlimit="10" stroke-dasharray="3 3" pointer-events="stroke" style="stroke: light-dark(rgb(45, 106, 45), rgb(124, 176, 124));"/></g></g><g data-cell-id="thorFlat"><g transform="translate(0.5,0.5)"><path d="M 89.6 260 L 502.6 260" fill="none" stroke="#2d6a2d" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(45, 106, 45), rgb(124, 176, 124));"/></g></g><g data-cell-id="thorDrop"><g transform="translate(0.5,0.5)"><path d="M 502.6 260 L 524.6 389" fill="none" stroke="#2d6a2d" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(45, 106, 45), rgb(124, 176, 124));"/></g></g><g data-cell-id="thorDram"><g transform="translate(0.5,0.5)"><path d="M 524.6 389 L 749.6 389" fill="none" stroke="#2d6a2d" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(45, 106, 45), rgb(124, 176, 124));"/></g></g><g data-cell-id="thorL2lbl"><g><rect x="119.6" y="244" width="220" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2d6a2d" font-family="Helvetica" text-anchor="start" font-size="9px" style="fill: light-dark(rgb(45, 106, 45), rgb(124, 176, 124));"><rect fill="#ffffff" stroke="none" x="121" y="252" width="134" height="12" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="121.6" y="259">Thor L2-resident 3790 GB/s [A.6]</text></g></g></g><g data-cell-id="thorDramlbl"><g><rect x="569.6" y="372" width="180" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2d6a2d" font-family="Helvetica" text-anchor="start" font-size="9px" style="fill: light-dark(rgb(45, 106, 45), rgb(124, 176, 124));"><rect fill="#ffffff" stroke="none" x="571" y="380" width="111" height="12" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="571.6" y="387">Thor DRAM 259 GB/s [A.6]</text></g></g></g><g data-cell-id="thorRatio"><g><rect x="507.6" y="306" width="70" height="16" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2d6a2d" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="10px" style="fill: light-dark(rgb(45, 106, 45), rgb(124, 176, 124));"><rect fill="#ffffff" stroke="none" x="518" y="314" width="51" height="13" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="542.6" y="322">14.6× [A.6]</text></g></g></g><g data-cell-id="thorArrow"><g transform="translate(0.5,0.5)"><path d="M 513.6 270.37 L 513.6 378.63" fill="none" stroke="#2d6a2d" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(45, 106, 45), rgb(124, 176, 124));"/><path d="M 513.6 265.12 L 517.1 272.12 L 513.6 270.37 L 510.1 272.12 Z" fill="#2d6a2d" stroke="#2d6a2d" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(45, 106, 45), rgb(124, 176, 124)); stroke: light-dark(rgb(45, 106, 45), rgb(124, 176, 124));"/><path d="M 513.6 383.88 L 510.1 376.88 L 513.6 378.63 L 517.1 376.88 Z" fill="#2d6a2d" stroke="#2d6a2d" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(45, 106, 45), rgb(124, 176, 124)); stroke: light-dark(rgb(45, 106, 45), rgb(124, 176, 124));"/></g></g><g data-cell-id="orinFlat"><g transform="translate(0.5,0.5)"><path d="M 89.6 286 L 254.6 286" fill="none" stroke="#2a4d7a" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(42, 77, 122), rgb(148, 178, 217));"/></g></g><g data-cell-id="orinDrop"><g transform="translate(0.5,0.5)"><path d="M 254.6 286 L 274.6 407" fill="none" stroke="#2a4d7a" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(42, 77, 122), rgb(148, 178, 217));"/></g></g><g data-cell-id="orinDram"><g transform="translate(0.5,0.5)"><path d="M 274.6 407 L 749.6 407" fill="none" stroke="#2a4d7a" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(42, 77, 122), rgb(148, 178, 217));"/></g></g><g data-cell-id="orinL2lbl"><g><rect x="99.6" y="270" width="150" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2a4d7a" font-family="Helvetica" text-anchor="start" font-size="9px" style="fill: light-dark(rgb(42, 77, 122), rgb(148, 178, 217));"><rect fill="#ffffff" stroke="none" x="101" y="278" width="133" height="12" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="101.6" y="285">Orin L2-resident 2200 GB/s [A.6]</text></g></g></g><g data-cell-id="orinDramlbl"><g><rect x="319.6" y="410" width="170" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2a4d7a" font-family="Helvetica" text-anchor="start" font-size="9px" style="fill: light-dark(rgb(42, 77, 122), rgb(148, 178, 217));"><rect fill="#ffffff" stroke="none" x="321" y="418" width="109" height="12" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="321.6" y="425">Orin DRAM 177 GB/s [A.6]</text></g></g></g><g data-cell-id="orinRatio"><g><rect x="179.6" y="334" width="70" height="16" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#2a4d7a" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="10px" style="fill: light-dark(rgb(42, 77, 122), rgb(148, 178, 217));"><rect fill="#ffffff" stroke="none" x="190" y="342" width="51" height="13" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="214.6" y="350">12.4× [A.6]</text></g></g></g><g data-cell-id="orinArrow"><g transform="translate(0.5,0.5)"><path d="M 237.6 296.37 L 237.6 396.63" fill="none" stroke="#2a4d7a" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(42, 77, 122), rgb(148, 178, 217));"/><path d="M 237.6 291.12 L 241.1 298.12 L 237.6 296.37 L 234.1 298.12 Z" fill="#2a4d7a" stroke="#2a4d7a" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(42, 77, 122), rgb(148, 178, 217)); stroke: light-dark(rgb(42, 77, 122), rgb(148, 178, 217));"/><path d="M 237.6 401.88 L 234.1 394.88 L 237.6 396.63 L 241.1 394.88 Z" fill="#2a4d7a" stroke="#2a4d7a" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(42, 77, 122), rgb(148, 178, 217)); stroke: light-dark(rgb(42, 77, 122), rgb(148, 178, 217));"/></g></g><g data-cell-id="latbox"><g transform="translate(0.5,0.5)"><rect x="539.6" y="462" width="330" height="184" rx="27.6" ry="27.6" fill="#fbf7ef" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(251, 247, 239), rgb(28, 24, 17)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe center; width: 328px; height: 1px; padding-top: 473px; margin-left: 541px;"><div style="box-sizing: border-box; font-size: 0; text-align: center; color: #000000; "><div style="display: inline-block; font-size: 10px; font-family: Helvetica; color: light-dark(#000000, #ffffff); line-height: 1.2; pointer-events: all; font-weight: bold; white-space: normal; word-wrap: normal; ">Latency shelves — dependent-load latency by level [A.7]</div></div></div></foreignObject><text x="705" y="483" fill="#000000" font-family="Helvetica" font-size="10px" text-anchor="middle" font-weight="bold" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));">Latency shelves — dependent-load latency by level [A.7]</text></switch></g></g></g><g data-cell-id="lat_hdr"><g><rect x="551.6" y="486" width="310" height="13" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="monospace" font-weight="bold" text-anchor="start" font-size="8px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="553.6" y="500">Level       Orin       Thor</text></g></g></g><g data-cell-id="lat_l1"><g><rect x="551.6" y="501" width="310" height="13" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="monospace" text-anchor="start" font-size="8px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="553.6" y="515">L1 shelf    29.9 ns    25.3 ns</text></g></g></g><g data-cell-id="lat_l2"><g><rect x="551.6" y="516" width="310" height="13" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#b85450" font-family="monospace" text-anchor="start" font-size="8px" style="fill: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"><text x="553.6" y="530">L2 shelf    ~146 ns    ~156 ns  (unchanged!)</text></g></g></g><g data-cell-id="lat_cliff"><g><rect x="551.6" y="531" width="310" height="13" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="monospace" text-anchor="start" font-size="8px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="553.6" y="545">L2 cliff    4.0 MB     32 MB</text></g></g></g><g data-cell-id="lat_dram"><g><rect x="551.6" y="546" width="310" height="13" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="monospace" text-anchor="start" font-size="8px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="553.6" y="560">DRAM shelf  ~675 ns    ~510 ns</text></g></g></g><g data-cell-id="lat_save"><g><rect x="551.6" y="561" width="310" height="13" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="monospace" text-anchor="start" font-size="8px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="553.6" y="575">L2 save     ~530ns 4.6x  ~355ns 3.3x</text></g></g></g><g data-cell-id="lat_note"><g><rect x="551.6" y="578" width="306" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" font-style="italic" text-anchor="start" font-size="8px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="557.6" y="592">L2 latency holds fixed in TIME, not cycles (190 vs 246 cyc): the memory win is capacity, not reach [A.7].</text></g></g></g><g data-cell-id="lg"><g transform="translate(0.5,0.5)"><rect x="89.6" y="464" width="430" height="100" rx="15" ry="15" fill="#f5f5f5" stroke="#999999" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(153, 153, 153), rgb(106, 106, 106));"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 422px; height: 1px; padding-top: 475px; margin-left: 98px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #000000; "><div style="display: inline-block; font-size: 9px; font-family: Helvetica; color: light-dark(#000000, #ffffff); line-height: 1.2; pointer-events: all; font-weight: bold; white-space: normal; word-wrap: normal; ">Legend</div></div></div></foreignObject><text x="98" y="484" fill="#000000" font-family="Helvetica" font-size="9px" font-weight="bold" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));">Legend</text></switch></g></g></g><g data-cell-id="lg1"><g><rect x="99.6" y="486" width="420" height="12" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="start" font-size="8px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="101.6" y="500">— solid green = Thor measured bandwidth · dashed blue = Orin measured bandwidth</text></g></g></g><g data-cell-id="lg2"><g><rect x="99.6" y="502" width="420" height="12" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="start" font-size="8px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="101.6" y="516">— vertical dashed line = each board's L2 capacity (the cliff location)</text></g></g></g><g data-cell-id="lg3"><g><rect x="99.6" y="518" width="420" height="12" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="start" font-size="8px" style="fill: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));"><text x="101.6" y="532">— double arrow + N× = measured L2:DRAM bandwidth ratio</text></g></g></g><g data-cell-id="lg4"><g><rect x="99.6" y="534" width="420" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" font-style="italic" text-anchor="start" font-size="8px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="101.6" y="548">Bandwidth axis is log; curve shapes are schematic, plateaus/cliffs at exact source values.</text></g></g></g><g data-cell-id="src"><g><rect x="89.6" y="574" width="430" height="64" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 424px; height: 1px; padding-top: 581px; margin-left: 96px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #555555; "><div style="display: inline-block; font-size: 8px; font-family: Helvetica; color: light-dark(#555555, #a4a4a4); line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Sources (from constants.json / notes): [A.6] l2_resident_read_bandwidth, dram_bandwidth_read_measured, l2_dram_bandwidth_ratio, read cliff = L2 size. [A.7] latency_l1/l2/dram shelves, L2-hit saving. Values loaded, not retyped.</div></div></div></foreignObject><text x="96" y="589" fill="#555555" font-family="Helvetica" font-size="8px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><tspan x="96" y="589">Sources (from constants.json / notes): [A.6] l2_resident_read_bandwidth, dram_bandwidth_read_measured,</tspan><tspan x="96" y="599">l2_dram_bandwidth_ratio, read cliff = L2 size. [A.7] latency_l1/l2/dram shelves, L2-hit saving. Values loaded, not</tspan><tspan x="96" y="609">retyped.</tspan></text></switch></g></g></g></g></g></g></svg>