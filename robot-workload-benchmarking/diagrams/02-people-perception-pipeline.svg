<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="770" viewBox="0 0 1320 770"><rect x="0" y="0" width="1320" height="770" fill="#ffffff"/><defs><marker id="arrow_6c8ebf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#6c8ebf"/></marker><marker id="arrow_82b366" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#82b366"/></marker></defs><line x1="215.0" y1="141.0" x2="235.0" y2="141.0" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><line x1="410.0" y1="141.0" x2="425.0" y2="141.0" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><line x1="512.5" y1="172.0" x2="512.5" y2="192.0" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow_82b366)"/><line x1="600.0" y1="221.0" x2="640.0" y2="139.0" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><line x1="840.0" y1="139.0" x2="860.0" y2="139.0" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><line x1="1060.0" y1="139.0" x2="1080.0" y2="139.0" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow_82b366)"/><line x1="740.0" y1="168.0" x2="740.0" y2="180.0" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><line x1="740.0" y1="238.0" x2="740.0" y2="300.0" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow_82b366)"/><line x1="960.0" y1="238.0" x2="960.0" y2="300.0" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow_82b366)"/><line x1="1180.0" y1="238.0" x2="1180.0" y2="300.0" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow_82b366)"/><line x1="1180.0" y1="372.0" x2="1180.0" y2="392.0" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><rect x="20" y="12" width="1280" height="30" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1"/><foreignObject x="20" y="12" width="1280" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1280px;height:30px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">People perception: a short GPU network chain wrapped in CPU bookkeeping that grows with the number of people N</div></div></foreignObject><rect x="40" y="66" width="560" height="26" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><foreignObject x="40" y="66" width="560" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:560px;height:26px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">PER-FRAME work  (fixed cost, once per camera frame)</div></div></foreignObject><rect x="640" y="66" width="640" height="26" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/><foreignObject x="640" y="66" width="640" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:640px;height:26px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">PER-PERSON work  (runs once per detected person -&gt; scales ~linearly with N)</div></div></foreignObject><rect x="40" y="110" width="175" height="62" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="40" y="110" width="175" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:175px;height:62px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Decode frame<br/>(CPU)</div></div></foreignObject><rect x="235" y="110" width="175" height="62" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="235" y="110" width="175" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:175px;height:62px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Rectify / letterbox<br/>resize to net input (CPU)</div></div></foreignObject><rect x="425" y="110" width="175" height="62" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="425" y="110" width="175" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:175px;height:62px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Person detection<br/>YOLOX (GPU)</div></div></foreignObject><rect x="425" y="192" width="175" height="58" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="425" y="192" width="175" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:175px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">NMS<br/>de-dup boxes (CPU)</div></div></foreignObject><rect x="640" y="110" width="200" height="58" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="640" y="110" width="200" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Crop / warp per person<br/>(CPU) - xN</div></div></foreignObject><rect x="860" y="110" width="200" height="58" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="860" y="110" width="200" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Face detect + landmarks<br/>SCRFD (GPU) - xN</div></div></foreignObject><rect x="1080" y="110" width="200" height="58" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="1080" y="110" width="200" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Face recognition<br/>ArcFace embedding (GPU) - xN</div></div></foreignObject><rect x="640" y="180" width="200" height="58" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="640" y="180" width="200" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Body re-ID<br/>OSNet embedding (GPU) - xN</div></div></foreignObject><rect x="860" y="180" width="200" height="58" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="860" y="180" width="200" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">2D pose<br/>BlazePose (GPU) - xN</div></div></foreignObject><rect x="1080" y="180" width="200" height="58" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="1080" y="180" width="200" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Active-speaker<br/>Light-ASD (GPU) - xN</div></div></foreignObject><rect x="640" y="300" width="200" height="72" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="640" y="300" width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:72px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Tracking-by-detection<br/>Kalman predict + Hungarian match<br/>(CPU) - per track per frame</div></div></foreignObject><rect x="860" y="300" width="200" height="72" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="860" y="300" width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:72px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Smoothing<br/>One Euro filter<br/>(CPU) - per tracked quantity</div></div></foreignObject><rect x="1080" y="300" width="200" height="72" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="1080" y="300" width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:72px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">3D projection<br/>sample depth map at pixels<br/>(CPU) - per person</div></div></foreignObject><rect x="1080" y="392" width="200" height="58" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="1080" y="392" width="200" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Publish tracks<br/>(illustrative ~10 Hz,<br/>often rate-capped)</div></div></foreignObject><rect x="40" y="300" width="560" height="120" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="40" y="300" width="560" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:560px;height:120px;display:flex;align-items:center;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">HEADLINE LESSON (A2):<br/>The neural networks run on the GPU and are individually small.<br/>But NMS + Kalman + Hungarian + One Euro + depth-sampling + coordinate<br/>transforms all run on the CPU, usually in a scripting language, once per<br/>person per frame. On a small robot computer this CPU post-processing<br/>FREQUENTLY EXCEEDS the GPU inference time. A GPU-busy-only benchmark<br/>concludes &#x27;plenty of headroom&#x27; while the CPU cores are already full.</div></div></foreignObject><rect x="40" y="472" width="1240" height="76" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="40" y="472" width="1240" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:76px;display:flex;align-items:center;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">WHERE COST GROWS WITH N (people in view):  per-frame stages (decode, letterbox, YOLOX, NMS) stay FLAT.  Per-person stages (crop/warp, SCRFD, ArcFace, OSNet, BlazePose, Light-ASD, Kalman+Hungarian, One Euro, 3D projection) grow ~LINEARLY with N.  Measure at N = 1, 2, 5, 10: report the fixed per-frame cost AND the per-person slope separately, not one average.  Note: occlusion means fewer than N may actually be detected, so N = people in view, not people detected.</div></div></foreignObject><rect x="40" y="566" width="600" height="92" fill="#f5f5f5" stroke="#999999" stroke-width="1"/><foreignObject x="40" y="566" width="600" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:92px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Legend<br/>green = runs on the GPU (a neural network)<br/>blue = runs on the CPU (post-processing &#x27;glue&#x27;)<br/>&#x27;xN&#x27; = stage runs once per detected person (scales with N)<br/>purple band = the N-scaling rule itself</div></div></foreignObject><rect x="40" y="674" width="1240" height="70" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><foreignObject x="40" y="674" width="1240" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:70px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Source: note A2. Models: YOLOX (arXiv:2107.08430), SCRFD (arXiv:2105.04714), ArcFace (arXiv:1801.07698), OSNet (arXiv:1905.00953), BlazePose (arXiv:2006.10204), Light-ASD (CVPR 2023). CPU post-processing: NMS; Kalman filter + Hungarian algorithm (tracking-by-detection); One Euro filter (Casiez et al., CHI 2012); 3D projection by sampling the depth map from A1.  Output rate ~10 Hz is ILLUSTRATIVE [perception_output_rate_illustrative]; camera 30 Hz [camera_frame_rate_illustrative]. A software rate cap is a ceiling, not a compute signal (B2). No measured robot numbers.</div></div></foreignObject></svg>