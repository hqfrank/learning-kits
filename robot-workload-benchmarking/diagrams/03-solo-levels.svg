<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><rect x="0" y="0" width="1280" height="820" fill="#ffffff"/><defs></defs><rect x="20" y="12" width="1240" height="30" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1"/><foreignObject x="20" y="12" width="1240" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:30px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Three solo levels of realism: the unit is the DEPLOYED SERVICE, not the model - and the gaps between levels are the finding</div></div></foreignObject><rect x="60" y="70" width="740" height="470" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="60" y="70" width="740" height="470"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:740px;height:470px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">L3  -  service WITH its real upstream<br/>answers: how fast is the service on REAL INPUT?<br/>(e.g. the camera service feeding mapping)</div></div></foreignObject><rect x="120" y="190" width="620" height="320" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="120" y="190" width="620" height="320"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:620px;height:320px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">L2  -  the service AS DEPLOYED<br/>answers: how fast is the SERVICE?<br/>real container + runtime + pre/post-processing, driven through its own interface</div></div></foreignObject><rect x="190" y="320" width="480" height="160" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="190" y="320" width="480" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:480px;height:160px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">L1  -  the engine alone<br/>answers: how fast is the NETWORK?<br/>compiled inference engine timed in isolation<br/>(trtexec-style: no service wrapper, no middleware)<br/>= the floor</div></div></foreignObject><rect x="820" y="230" width="420" height="90" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="820" y="230" width="420" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:420px;height:90px;display:flex;align-items:center;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">GAP  L2 - L1 = the service&#x27;s OWN overhead<br/>= the CPU &#x27;glue&#x27; (pre/post-processing, container,<br/>runtime) around the bare network. On a small robot<br/>this glue usually dominates (see A2).</div></div></foreignObject><rect x="820" y="110" width="420" height="90" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="820" y="110" width="420" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:420px;height:90px;display:flex;align-items:center;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">GAP  L3 - L2 = the cost of REAL UPSTREAM data<br/>= real input shape and timing from the upstream<br/>service it consumes. Captures real-input cost, but<br/>adds the upstream&#x27;s variability.</div></div></foreignObject><rect x="820" y="340" width="420" height="26" fill="#f8cecc" stroke="#b85450" stroke-width="1"/><foreignObject x="820" y="340" width="420" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:420px;height:26px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">SIDE PANEL: idle floor vs working cost</div></div></foreignObject><rect x="820" y="372" width="200" height="120" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="820" y="372" width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:120px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">IDLE FLOOR<br/>an event-driven service<br/>with NO input does almost<br/>nothing (~0 cost).<br/>This is NOT its working<br/>cost. Must be labelled<br/>&#x27;idle floor&#x27;, never<br/>reported as the cost.</div></div></foreignObject><rect x="1040" y="372" width="200" height="120" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="1040" y="372" width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:120px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">WORKING COST<br/>DRIVE the service through<br/>its own API:<br/>- speech plan -&gt; voice<br/>- inject detections -&gt; perception<br/>- replay motion -&gt; mapping<br/>- command a mode -&gt; control<br/>so it does REAL work.</div></div></foreignObject><rect x="60" y="560" width="1180" height="96" rx="8" fill="#f0f0f0" stroke="#999999" stroke-width="1.5"/><foreignObject x="60" y="560" width="1180" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1180px;height:96px;display:flex;align-items:center;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">HOW TO USE (C2):  Measure SOLO before combined - the clean per-service baseline is the DENOMINATOR for the interference factor the combined run reveals (C6); it is a result, not a rehearsal.  Pick the level that answers your question: L1 for the network floor, L2 for the deployable cost, L3 for real-input cost.  Measure the deployed service (L2), not the bare model (L1) - the network is only a fraction of the service&#x27;s cost.  A &#x27;replaced pair&#x27; (sized stand-in) is measured at its level and labelled with its basis, so the combined run adds a known, labelled quantity.</div></div></foreignObject><rect x="60" y="676" width="560" height="76" fill="#f5f5f5" stroke="#999999" stroke-width="1"/><foreignObject x="60" y="676" width="560" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:560px;height:76px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Legend<br/>Nesting = increasing realism: L1 (engine) within L2 (deployed service) within L3 (+ real upstream)<br/>green = L1 engine   blue = L2 service   purple = L3 upstream<br/>amber = the gap between two levels (what each gap measures)   red = the idle-floor caveat</div></div></foreignObject><rect x="640" y="676" width="600" height="76" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><foreignObject x="640" y="676" width="600" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:76px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Source: note C2 (solo runs and levels). L1 = a trtexec-style engine timing (NVIDIA TensorRT, docs.nvidia.com/deeplearning/tensorrt/). &#x27;Idle floor&#x27;, &#x27;working cost&#x27;, &#x27;driver&#x27;, and &#x27;replaced pair&#x27; are C2 terms. The interference factor the baseline feeds is defined in C6. No measured robot numbers.</div></div></foreignObject></svg>