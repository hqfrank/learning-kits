<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="860" viewBox="0 0 1340 860"><rect x="0" y="0" width="1340" height="860" fill="#ffffff"/><defs><marker id="arrow_6c8ebf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#6c8ebf"/></marker><marker id="arrow_999999" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#999999"/></marker><marker id="arrow_b85450" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b85450"/></marker></defs><line x1="580.0" y1="230.0" x2="620.0" y2="238.0" stroke="#b85450" stroke-width="2" marker-end="url(#arrow_b85450)"/><line x1="720.0" y1="226.8" x2="760.0" y2="156.0" stroke="#b85450" stroke-width="2" marker-end="url(#arrow_b85450)"/><line x1="580.0" y1="492.5" x2="620.0" y2="488.0" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><line x1="720.0" y1="476.8" x2="760.0" y2="324.0" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><line x1="380.0" y1="548.0" x2="1040.0" y2="564.0" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_999999)"/><rect x="20" y="12" width="1300" height="30" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1"/><foreignObject x="20" y="12" width="1300" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1300px;height:30px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Two machines: only the real stack runs on the robot; everything that stands in for the world runs on a separate harness machine</div></div></foreignObject><rect x="50" y="70" width="560" height="560" rx="8" fill="#eef4fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="50" y="70" width="560" height="560"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:560px;height:560px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">ROBOT COMPUTER  -  runs ONLY the real deployed stack (the system under test)</div></div></foreignObject><rect x="80" y="120" width="300" height="150" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="80" y="120" width="300" height="150"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:150px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Real services (A0-A7):<br/>- camera / depth / VIO<br/>- people perception<br/>- mapping + navigation<br/>- voice (VAD, wake-word)<br/>- VLA + cognition<br/>- middleware router, telemetry</div></div></foreignObject><rect x="80" y="286" width="300" height="90" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="80" y="286" width="300" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:90px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Whole-body control loop (A4)<br/>MLP policy on ISOLATED cores<br/>50 Hz / 20 ms deadline<br/>(the island the bench tests)</div></div></foreignObject><rect x="80" y="400" width="300" height="90" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="80" y="400" width="300" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:90px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Observers / probes (B0, B2, B4)<br/>on their OWN dedicated core,<br/>off the application cores,<br/>ready + settled BEFORE t0</div></div></foreignObject><rect x="80" y="512" width="300" height="72" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="80" y="512" width="300" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:72px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Clock-sync probe (B2)<br/>SNTP, several times/sec<br/>reports a bounded offset<br/>(illustrative &lt; 0.5 ms)</div></div></foreignObject><rect x="410" y="130" width="170" height="200" rx="8" fill="#eafaf1" stroke="#82b366" stroke-width="1.5"/><foreignObject x="410" y="130" width="170" height="200"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:170px;height:200px;display:flex;align-items:flex-start;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">ISLAND A<br/>(control + sensor<br/>wire protocols)<br/><br/>fast bus endpoints,<br/>mic stream,<br/>camera topics</div></div></foreignObject><rect x="410" y="400" width="170" height="185" rx="8" fill="#fdf2f2" stroke="#b85450" stroke-width="1.5"/><foreignObject x="410" y="400" width="170" height="185"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:170px;height:185px;display:flex;align-items:flex-start;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">ISLAND B<br/>(bulk feeds +<br/>cloud calls)<br/><br/>synthetic camera,<br/>bag replay,<br/>cloud-API calls</div></div></foreignObject><rect x="730" y="70" width="560" height="560" rx="8" fill="#fff6ec" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="730" y="70" width="560" height="560"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:560px;height:560px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">HARNESS MACHINE  -  stands in for the physical world; its CPU is measured HERE, never counted as stack load</div></div></foreignObject><rect x="760" y="120" width="250" height="72" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="760" y="120" width="250" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:250px;height:72px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Fake motor boards (C3, A4)<br/>real wire protocol + framing,<br/>real rate (100-1000 Hz)</div></div></foreignObject><rect x="760" y="204" width="250" height="72" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="760" y="204" width="250" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:250px;height:72px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Fake microphone board (C3, A5)<br/>match frames/pkt + packets/msg<br/>(wrong framing biases every consumer)</div></div></foreignObject><rect x="760" y="288" width="250" height="72" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="760" y="288" width="250" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:250px;height:72px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Synthetic camera (C3, A2)<br/>generate frames with N people,<br/>or inject ground-truth detections</div></div></foreignObject><rect x="760" y="372" width="250" height="64" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="760" y="372" width="250" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:250px;height:64px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Bag replay (C3, A3)<br/>recorded motion drives bursty<br/>mapping; person-data stays local</div></div></foreignObject><rect x="760" y="448" width="250" height="72" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="760" y="448" width="250" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:250px;height:72px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Cloud-API stubs (C3, A5/A6)<br/>faithful schema + status codes,<br/>LABELLED latency assumption</div></div></foreignObject><rect x="760" y="532" width="250" height="64" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="760" y="532" width="250" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:250px;height:64px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Harness CPU measured here<br/>(not counted as stack load)</div></div></foreignObject><rect x="1040" y="532" width="220" height="64" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="1040" y="532" width="220" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:220px;height:64px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Clock-sync peer (B2)<br/>SNTP responder for<br/>the offset bound</div></div></foreignObject><rect x="620" y="210" width="100" height="56" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="620" y="210" width="100" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100px;height:56px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">DEDICATED<br/>low-latency<br/>CONTROL link</div></div></foreignObject><rect x="620" y="460" width="100" height="56" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="620" y="460" width="100" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:100px;height:56px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">BULK link<br/>(feeds,<br/>replay)</div></div></foreignObject><rect x="50" y="660" width="620" height="100" fill="#f5f5f5" stroke="#999999" stroke-width="1"/><foreignObject x="50" y="660" width="620" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:620px;height:100px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Legend<br/>blue = robot (system under test)   amber = harness machine<br/>green = a faithful fake / stub / synthetic input   purple = observers &amp; harness-CPU accounting<br/>red = the hard control loop + its dedicated link (the thing most at risk)<br/>Two links: a DEDICATED low-latency link for control (so its timing is not stolen) and a BULK link for<br/>feeds; TWO network ISLANDS so a live and a synthetic source sharing a topic name do not collide.</div></div></foreignObject><rect x="690" y="660" width="600" height="100" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><foreignObject x="690" y="660" width="600" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:100px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Source: note C3 (harness, second machine, fake boards + framing fidelity, schema-faithful stubs, synthetic input / detection injection, bag replay, network islands + cut edges). Control loop + isolation: A4. Fake-mic framing + per-message cost: A5. Synthetic N people: A2. Bursty mapping bag replay: A3. Cross-machine clock offset by SNTP, bound &lt; smallest latency: B2 (RFC 4330). Observer core: B0, B4. Rates ILLUSTRATIVE: motor bus 100-1000 Hz [motor_bus_rate_illustrative]; offset &lt; 0.5 ms [clock_offset_target_illustrative]. No measured robot numbers.</div></div></foreignObject></svg>