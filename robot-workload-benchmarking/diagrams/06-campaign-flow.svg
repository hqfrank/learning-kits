<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="790" viewBox="0 0 1340 790"><rect x="0" y="0" width="1340" height="790" fill="#ffffff"/><defs><marker id="arrow_6c8ebf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#6c8ebf"/></marker><marker id="arrow_82b366" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#82b366"/></marker><marker id="arrow_9673a6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#9673a6"/></marker></defs><line x1="320.0" y1="112.0" x2="360.0" y2="112.0" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow_6c8ebf)"/><line x1="640.0" y1="112.0" x2="680.0" y2="112.0" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow_6c8ebf)"/><line x1="960.0" y1="112.0" x2="1000.0" y2="112.0" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow_6c8ebf)"/><line x1="1150.0" y1="158.0" x2="580.0" y2="200.0" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow_6c8ebf)"/><line x1="640.0" y1="260.0" x2="680.0" y2="260.0" stroke="#6c8ebf" stroke-width="2" marker-end="url(#arrow_6c8ebf)"/><line x1="742.0" y1="320.0" x2="340.0" y2="410.0" stroke="#82b366" stroke-width="2" marker-end="url(#arrow_82b366)"/><line x1="640.0" y1="470.0" x2="680.0" y2="470.0" stroke="#82b366" stroke-width="2" marker-end="url(#arrow_82b366)"/><line x1="990.0" y1="530.0" x2="1174.0" y2="566.0" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_9673a6)"/><rect x="20" y="12" width="1300" height="30" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1"/><foreignObject x="20" y="12" width="1300" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1300px;height:30px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">The campaign flow: predict before you measure, freeze the plan, build up in tiers, gate every window, then attribute the first limit</div></div></foreignObject><rect x="40" y="66" width="280" height="92" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="40" y="66" width="280" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:280px;height:92px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">1. PREDICT - compute-budget ledger (C1)<br/>t = FLOP/R + bytes/B + t_CPU per stage.<br/>R, B MEASURED on target, not datasheet.<br/>Name bound class + falsifiable predictions.<br/>Small batch-1 models = launch-bound.</div></div></foreignObject><rect x="360" y="66" width="280" height="92" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="360" y="66" width="280" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:280px;height:92px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">2. PRE-REGISTER (C5)<br/>Freeze hypotheses, PASS/FAIL thresholds,<br/>and the seeded run order BEFORE data.<br/>No tuning after data. Disclose anything<br/>seen early.</div></div></foreignObject><rect x="680" y="66" width="280" height="92" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="680" y="66" width="280" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:280px;height:92px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">3. SOLO runs (C2)<br/>Each service alone: L1 engine / L2 deployed /<br/>L3 + upstream. DRIVE event-driven services<br/>(no idle floors). Clean baseline = the<br/>DENOMINATOR for interference.</div></div></foreignObject><rect x="1000" y="66" width="300" height="92" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="1000" y="66" width="300" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:92px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">4. REVIEW<br/>Independent second person checks the<br/>solo baselines, gate logic, and statistics<br/>before the combined runs begin.</div></div></foreignObject><rect x="40" y="200" width="600" height="120" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="40" y="200" width="600" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:120px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">5. COMBINED runs in TIERS (C6), seeded INTERLEAVED order (C5)<br/>Build up the stack: default load -&gt; next-generation -&gt; + manipulation -&gt; + on-demand large models.<br/>Interleave A/B (ABBA / mirror) so slow drift cancels; replicate blocks; paired within-block comparisons.<br/>Interference factor = combined value / solo sum, read per KPI (the TAIL, not the mean).</div></div></foreignObject><rect x="680" y="200" width="620" height="120" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="680" y="200" width="620" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:620px;height:120px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">6. VALIDITY GATES per window (C4) - warm-up then a fixed window from a sample-count rule<br/>alive (rate DROP is an outcome, silence is a void) | expected input rates | crash scan | foreign-CPU census | clocks locked at BOTH ends<br/>=&gt; each window is VALID (counts) / FLAGGED (kept with caveat) / VOID (thrown out, with a recorded void class)</div></div></foreignObject><rect x="680" y="336" width="195" height="48" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="680" y="336" width="195" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:195px;height:48px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">VALID<br/>numbers count</div></div></foreignObject><rect x="890" y="336" width="195" height="48" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="890" y="336" width="195" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:195px;height:48px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">FLAGGED<br/>kept with a caveat</div></div></foreignObject><rect x="1100" y="336" width="200" height="48" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="1100" y="336" width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:48px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">VOID<br/>record the void class</div></div></foreignObject><rect x="40" y="410" width="600" height="120" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="40" y="410" width="600" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:120px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">7. &#x27;CARRIES&#x27; VERDICT per KPI band (C6), over valid windows<br/>Each timing KPI (control-loop misses, camera rate, perception rate, VLA rate) has pre-set bands:<br/>PASS band | UNRESOLVED zone | FAIL band.<br/>A cell CARRIES only if EVERY applicable KPI is PASS. Any FAIL =&gt; does not carry. Any UNRESOLVED (no FAIL) =&gt; unresolved.</div></div></foreignObject><rect x="680" y="410" width="620" height="120" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="680" y="410" width="620" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:620px;height:120px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">8. FIRST-LIMIT ATTRIBUTION (C6), pre-registered classifier<br/>CPU-pool (pool ~full + loser&#x27;s drop tracks rising run-queue wait) | GPU (GPU-busy ~saturated, GPU loser, CPU flat) |<br/>memory (mem index high, CPU-only loser, no CPU saturation) | none-observed; a loss with no matching signal = UNATTRIBUTED.<br/>SATURATED-BASELINE caveat: if the lightest tier is already at the wall, the classifier reads unattributed BY CONSTRUCTION - report the saturation, do not pretend it found nothing.</div></div></foreignObject><rect x="40" y="566" width="1260" height="78" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="40" y="566" width="1260" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1260px;height:78px;display:flex;align-items:center;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">LOOP BACK ONLY for a HARNESS / INSTRUMENT bug (C5):  record a numbered ADDENDUM (defect, evidence, fix, impact on windows already run); if a recorded window was affected, SUPERSEDE it - re-run whole under the SAME seeds, keep the original, log it.  NEVER loop back to change stack behaviour: a surprise about the STACK is a FINDING, not a bug to tune away. No tuning after data (C5).</div></div></foreignObject><rect x="40" y="664" width="620" height="92" fill="#f5f5f5" stroke="#999999" stroke-width="1"/><foreignObject x="40" y="664" width="620" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:620px;height:92px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Legend<br/>blue = a campaign step (predict -&gt; pre-register -&gt; solo -&gt; review -&gt; combined)<br/>amber = validity gates + the FLAGGED outcome   green = a verdict step (valid / carries / attribution)<br/>red = VOID / the saturated-baseline caveat (the honest failure modes)   purple = the addenda/supersede loop<br/>Arrows = campaign order; the only backward arrow is the harness-bug loop, never a stack-behaviour loop.</div></div></foreignObject><rect x="680" y="664" width="620" height="92" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><foreignObject x="680" y="664" width="620" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:620px;height:92px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Source: C1 (predict-then-measure, compute-budget ledger, bound class, falsifiable predictions, launch-bound batch-1 models); C5 (pre-registration, no tuning after data, seeded interleaved ABBA/mirror order, replicate blocks, paired comparisons, addenda + supersedes, independent review); C2 (solo L1/L2/L3, idle floors, drivers); C4 (warm-up + fixed window, sample-count rule, validity gates alive/rates/crash/census/clocks, valid vs flagged vs void + void class); C6 (workload tiers, interference factor, PASS/UNRESOLVED/FAIL bands, first-limit attribution CPU/GPU/memory/none, saturated-baseline failure). No measured robot numbers.</div></div></foreignObject></svg>