<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880"><rect x="0" y="0" width="1280" height="880" fill="#ffffff"/><defs><marker id="arrow_6c8ebf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#6c8ebf"/></marker><marker id="arrow_9673a6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#9673a6"/></marker><marker id="arrow_b85450" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b85450"/></marker><marker id="arrow_d79b00" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#d79b00"/></marker></defs><line x1="330.0" y1="155.0" x2="350.0" y2="155.0" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow_9673a6)"/><line x1="495.0" y1="190.0" x2="495.0" y2="204.0" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><line x1="408.0" y1="190.0" x2="408.0" y2="296.0" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><line x1="640.0" y1="335.0" x2="660.0" y2="335.0" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><line x1="330.0" y1="423.0" x2="350.0" y2="423.0" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow_9673a6)"/><line x1="640.0" y1="423.0" x2="660.0" y2="423.0" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><line x1="640.0" y1="243.0" x2="660.0" y2="567.6" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><line x1="805.0" y1="374.0" x2="805.0" y2="552.0" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><line x1="950.0" y1="591.0" x2="970.0" y2="591.0" stroke="#b85450" stroke-width="2" marker-end="url(#arrow_b85450)"/><rect x="20" y="12" width="1240" height="30" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1"/><foreignObject x="20" y="12" width="1240" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:30px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">A home robot is not one program with one bottleneck: it is a crowd of pipelines with different deadlines sharing one CPU, one GPU, one memory pool</div></div></foreignObject><rect x="40" y="70" width="290" height="28" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/><foreignObject x="40" y="70" width="290" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:28px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">SENSE  (read hardware)</div></div></foreignObject><rect x="350" y="70" width="290" height="28" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/><foreignObject x="350" y="70" width="290" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:28px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">PERCEIVE  (raw data -&gt; meaning)</div></div></foreignObject><rect x="660" y="70" width="290" height="28" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><foreignObject x="660" y="70" width="290" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:28px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">DECIDE  (choose what to do)</div></div></foreignObject><rect x="970" y="70" width="290" height="28" fill="#f8cecc" stroke="#b85450" stroke-width="1"/><foreignObject x="970" y="70" width="290" height="28"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:28px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">ACT  (command motors + speaker)</div></div></foreignObject><rect x="40" y="120" width="290" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="40" y="120" width="290" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:70px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Depth camera + IMU [A1]<br/>stereo pair, IMU at 100s Hz<br/>both CPU+GPU | on-board</div></div></foreignObject><rect x="350" y="120" width="290" height="70" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="350" y="120" width="290" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:70px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Depth map / point cloud / VIO [A1]<br/>neural depth = largest GPU cost<br/>both CPU+GPU | soft ~30 Hz | on-board</div></div></foreignObject><rect x="350" y="204" width="290" height="78" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="350" y="204" width="290" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:78px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">People perception [A2]<br/>detect/face/re-ID/pose/speaker + track<br/>networks GPU, CPU glue dominates<br/>both | soft ~10 Hz | on-board</div></div></foreignObject><rect x="350" y="296" width="290" height="78" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="350" y="296" width="290" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:78px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Mapping + localization [A3]<br/>keyframes, DISK/LightGlue/MixVPR,<br/>loop closure, iSAM2, TSDF  (BURSTY)<br/>both | soft | on-board</div></div></foreignObject><rect x="660" y="296" width="290" height="78" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="660" y="296" width="290" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:78px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Navigation / path planning [A3]<br/>search occupancy grid, replan<br/>mostly CPU | soft | on-board</div></div></foreignObject><rect x="40" y="388" width="290" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="40" y="388" width="290" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:70px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Microphone array [A5]<br/>packets: 48 frames/pkt @ 16 kHz<br/>CPU | on-board</div></div></foreignObject><rect x="350" y="388" width="290" height="70" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="350" y="388" width="290" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:70px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Voice: VAD + wake-word [A5]<br/>always on-board, gate heavier models<br/>mostly CPU (per-msg overhead) | soft</div></div></foreignObject><rect x="660" y="388" width="290" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="660" y="388" width="290" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:70px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">ASR / TTS / speech-to-speech [A5]<br/>Whisper-class; often CLOUD (stubbed)<br/>CPU/GPU or cloud | best-effort</div></div></foreignObject><rect x="660" y="472" width="290" height="66" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="660" y="472" width="290" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:66px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Cognition / on-demand LLM [A6]<br/>reasoning, called occasionally<br/>often CLOUD (stubbed) | best-effort</div></div></foreignObject><rect x="660" y="552" width="290" height="78" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="660" y="552" width="290" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:78px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">VLA (vision-language-action) [A6]<br/>backbone + action head -&gt; action chunk<br/>latency caps re-plan rate (e.g. 53 ms -&gt; ~19 Hz)<br/>GPU (bandwidth-bound) | best-effort | on-board</div></div></foreignObject><rect x="970" y="552" width="290" height="78" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="970" y="552" width="290" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:78px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Whole-body control [A4]<br/>MLP policy, fixed loop 50 Hz / 20 ms deadline<br/>motor bus 100-1000 Hz<br/>CPU (isolated cores) | HARD real-time | on-board</div></div></foreignObject><rect x="905" y="530" width="120" height="18" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1"/><foreignObject x="905" y="530" width="120" height="18"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:120px;height:18px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold;color:#b85450;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">action chunk -&gt;</div></div></foreignObject><rect x="40" y="644" width="900" height="52" rx="8" fill="#f0f0f0" stroke="#999999" stroke-width="1.5"/><foreignObject x="40" y="644" width="900" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:900px;height:52px;display:flex;align-items:center;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Platform layer [A7]: ROS 2 pub/sub + QoS, router (zenoh), containers, CPU quotas (cgroup cpu.max), core pinning (cpusets/isolcpus). Near-zero CPU, decides correctness: who gets which core, which messages arrive, whether the control loop is protected.</div></div></foreignObject><rect x="20" y="688" width="360" height="20" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1"/><foreignObject x="20" y="688" width="360" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:360px;height:20px;display:flex;align-items:center;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">THE FLOOR: one small on-board computer, cores partitioned -&gt;</div></div></foreignObject><rect x="40" y="712" width="400" height="58" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="40" y="712" width="400" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:400px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Shared pool cores<br/>perception, mapping, nav, voice,<br/>VLA, cognition compete here</div></div></foreignObject><rect x="460" y="712" width="360" height="58" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="460" y="712" width="360" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:360px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Service cores<br/>middleware router, telemetry,<br/>camera service threads</div></div></foreignObject><rect x="840" y="712" width="380" height="58" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="840" y="712" width="380" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:380px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.18;text-align:center;overflow:hidden;"><div style="width:100%;">Isolated control cores<br/>reserved (isolcpus): ONLY the<br/>hard control loop, IRQs moved off</div></div></foreignObject><rect x="40" y="476" width="560" height="160" fill="#f5f5f5" stroke="#999999" stroke-width="1"/><foreignObject x="40" y="476" width="560" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:560px;height:160px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Legend<br/>Fill = timing class:   red = hard real-time (miss = fault)   amber = soft real-time (miss degrades quality)   blue = best-effort (no deadline)<br/>   purple = sense / raw I/O     green = core-partition floor<br/>Each box tags: resource (CPU / GPU / both), rate class, and on-board vs cloud.<br/>Arrows = message flow on pub/sub topics; services never call each other directly.<br/>Layers below are PROVIDERS; layers above CONSUME them (interference flows up, not down).</div></div></foreignObject><rect x="40" y="792" width="1180" height="70" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><foreignObject x="40" y="792" width="1180" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1180px;height:70px;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.18;text-align:left;overflow:hidden;"><div style="width:100%;">Sources: stack structure + timing classes A0; depth/VIO/NVENC A1; perception chain A2; mapping/nav A3; control loop + isolation A4; voice + framing A5; VLA + re-plan A6; platform/QoS/quotas/pinning A7.  All rates ILLUSTRATIVE from constants.json: camera 30 Hz [camera_frame_rate_illustrative]; perception 10 Hz [perception_output_rate_illustrative]; control 50 Hz / 20 ms [wbc_control_rate_illustrative, wbc_deadline_illustrative]; motor bus 100-1000 Hz [motor_bus_rate_illustrative]; audio 48 frames/pkt @ 16 kHz [audio_packet_framing_illustrative, audio_sample_rate_illustrative].  VLA 53 ms -&gt; ~19 Hz is the SIBLING worked example [vla_latency_example_sibling]. No measured robot numbers.</div></div></foreignObject></svg>