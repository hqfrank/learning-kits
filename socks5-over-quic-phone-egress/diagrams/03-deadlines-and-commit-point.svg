<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="786" viewBox="0 0 1280 786"><rect x="0" y="0" width="1280" height="786" fill="#ffffff"/><defs><marker id="arrow_333333" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#333333"/></marker></defs><polyline points="630.0,488.0 650.0,488.0" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow_333333)"/><rect x="20" y="12" width="1240" height="44" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:44px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">Every wait before the CONNECT reply has a deadline, so a dead phone becomes an invisible switch to a direct connection; after the reply reaches the tool the connection is committed and a failure is a reset (illustrative deadlines)</div></div></foreignObject><rect x="30" y="86" width="1220" height="20" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="86" width="1220" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:20px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">LISTENER STEPS FOR ONE TOOL CONNECTION. Bars are the longest wait allowed at each step, to scale (30 px per second); they are maxima, not a typical timeline.</div></div></foreignObject><rect x="30" y="120" width="430" height="46" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="120" width="430" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:430px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">steps 1-4  read method request, answer &#x27;no auth&#x27;, read CONNECT, cloud deny list, tunnel present?</div></div></foreignObject><rect x="470" y="120" width="780" height="46" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="470" y="120" width="780" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:780px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#555555;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">no wait: no tunnel -&gt; direct connection now</div></div></foreignObject><rect x="30" y="174" width="430" height="46" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="174" width="430" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:430px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">step 5  open a stream to the phone [I1]</div></div></foreignObject><rect x="470" y="182" width="240" height="32" rx="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="470" y="182" width="240" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:240px;height:32px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">8 s</div></div></foreignObject><rect x="722" y="174" width="528" height="46" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="722" y="174" width="528" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:528px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#555555;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">stream cap 64 [I8] reached -&gt; REP 0x01 at once, no queue [P7]</div></div></foreignObject><rect x="30" y="228" width="430" height="46" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="228" width="430" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:430px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">step 6  forward method request, wait for the phone&#x27;s method reply (answered from memory) [I2]</div></div></foreignObject><rect x="470" y="236" width="90" height="32" rx="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="470" y="236" width="90" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:90px;height:32px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">3 s</div></div></foreignObject><rect x="30" y="282" width="430" height="46" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="282" width="430" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:430px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">step 7  forward CONNECT, wait for the phone&#x27;s reply [I3]</div></div></foreignObject><rect x="470" y="290" width="600" height="32" rx="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="470" y="290" width="600" height="32"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:32px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">20 s</div></div></foreignObject><rect x="470" y="326" width="300" height="26" rx="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="470" y="326" width="300" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">phone DNS worst 10 s [I4]</div></div></foreignObject><rect x="770" y="326" width="240" height="26" rx="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="770" y="326" width="240" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:240px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">phone TCP connect 8 s [I5]</div></div></foreignObject><rect x="1020" y="324" width="230" height="30" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="1020" y="324" width="230" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:230px;height:30px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">10 + 8 = 18 s [calc], under the 20 s deadline: a slow but live phone is not cut off</div></div></foreignObject><rect x="450" y="372" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="450" y="372" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">0 s</div></div></foreignObject><rect x="570" y="372" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="570" y="372" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">4 s</div></div></foreignObject><rect x="690" y="372" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="690" y="372" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">8 s</div></div></foreignObject><rect x="810" y="372" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="810" y="372" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">12 s</div></div></foreignObject><rect x="930" y="372" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="930" y="372" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">16 s</div></div></foreignObject><rect x="1050" y="372" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="1050" y="372" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">20 s</div></div></foreignObject><rect x="1170" y="372" width="40" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="1170" y="372" width="40" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:40px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">24 s</div></div></foreignObject><rect x="30" y="432" width="600" height="112" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="30" y="432" width="600" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:112px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">HANDSHAKE PHASE (steps 1-7): fallback is INVISIBLE<br/><br/>The tool has received only the &#x27;no auth&#x27; reply and is still waiting for its CONNECT reply. If any deadline fires, the listener closes the phone stream and opens a DIRECT connection from the cloud address instead. The tool cannot tell, except by its exit address.<br/><br/>Without these deadlines a dead phone would block each read until the QUIC idle timeout (30 s [I9]).</div></div></foreignObject><rect x="650" y="432" width="600" height="112" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="650" y="432" width="600" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:112px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">RELAY (step 8): COMMITTED, failure is a RESET<br/><br/>After the CONNECT reply the tool starts TLS through the phone; its TLS session is bound to the phone&#x27;s TCP connection to the site, so no fallback is possible. An idle relay closes after 120 s [I6]; an active transfer that loses the phone gets a partial response and a reset. The tool&#x27;s HTTP client retries on a new connection, which goes direct if the tunnel is gone.</div></div></foreignObject><rect x="545" y="396" width="190" height="30" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="545" y="396" width="190" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:30px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">COMMIT POINT: CONNECT reply sent to the tool</div></div></foreignObject><rect x="30" y="558" width="1220" height="26" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="558" width="1220" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend: blue bars = listener deadlines (cloud side) | green bars = the phone-side work the CONNECT deadline must cover | blue panel = invisible fallback zone | red panel = committed zone.</div></div></foreignObject><rect x="30" y="598" width="1220" height="172" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="598" width="1220" height="172"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:172px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Every number is loaded from ../constants.json by the key shown. [Pn] = public (an RFC or other public document, or my arithmetic on one); [In] = illustrative (a design parameter or a round value of the right order; never a measurement of a real deployment); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/C2-limits-and-failure-handling.md (handshake-phase table, the invariant, deadlines matched to the work, what the tool sees, fail fast on stream exhaustion). [calc]: 10 + 8 = 18 s.<br/>[I1] stream_open_timeout_illustrative = 8 s. illustrative: design parameter: listener waits this long to open a stream to the phone<br/>[I2] method_reply_deadline_illustrative = 3 s. illustrative: design parameter: the phone&#x27;s method reply is in-memory, so a short deadline detects a dead phone quickly<br/>[I3] connect_reply_deadline_illustrative = 20 s. illustrative: design parameter: must exceed phone_dns_worst_illustrative + phone_connect_timeout_illustrative<br/>[I4] phone_dns_worst_illustrative = 10 s. illustrative: design parameter: worst legitimate resolver time with retries<br/>[I5] phone_connect_timeout_illustrative = 8 s. illustrative: design parameter: phone-side TCP connect timeout<br/>[I6] relay_idle_timeout_illustrative = 120 s without a byte in either direction. illustrative: design parameter (per relayed TCP connection)<br/>[P7] socks5_reply_codes = {0x00: succeeded, 0x01: general SOCKS server failure, 0x02: connection not allowed by ruleset, 0x03: network unreachable, 0x04: host unreachable, 0x05: connection refused, 0x06: TTL expired, 0x07: command not supported, 0x08: address type not supported} REP byte. public: RFC 1928 §6<br/>[I8] phone_max_incoming_streams_illustrative = 64 concurrent server-initiated bidirectional streams. illustrative: design parameter: the effective concurrency cap of the whole tunnel<br/>[I9] conn_idle_timeout_illustrative = 30 s. illustrative: design parameter (QUIC max_idle_timeout on both ends)</div></div></foreignObject><line x1="470" y1="114" x2="470" y2="366" stroke="#333333" stroke-width="1.2"/><line x1="470" y1="366" x2="1190" y2="366" stroke="#333333" stroke-width="1.2"/><line x1="470" y1="366" x2="470" y2="371" stroke="#333333" stroke-width="1.2"/><line x1="590" y1="366" x2="590" y2="371" stroke="#333333" stroke-width="1.2"/><line x1="710" y1="366" x2="710" y2="371" stroke="#333333" stroke-width="1.2"/><line x1="830" y1="366" x2="830" y2="371" stroke="#333333" stroke-width="1.2"/><line x1="950" y1="366" x2="950" y2="371" stroke="#333333" stroke-width="1.2"/><line x1="1070" y1="366" x2="1070" y2="371" stroke="#333333" stroke-width="1.2"/><line x1="1190" y1="366" x2="1190" y2="371" stroke="#333333" stroke-width="1.2"/></svg>