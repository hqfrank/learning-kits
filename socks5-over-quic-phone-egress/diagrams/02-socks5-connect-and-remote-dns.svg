<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1083" viewBox="0 0 1280 1083"><rect x="0" y="0" width="1280" height="1083" fill="#ffffff"/><defs><marker id="arrow_2d7d2d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#2d7d2d"/></marker><marker id="arrow_333333" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#333333"/></marker></defs><polyline points="140.0,160.0 470.0,160.0" fill="none" stroke="#2d7d2d" stroke-width="1.5" marker-end="url(#arrow_2d7d2d)"/><polyline points="470.0,202.0 140.0,202.0" fill="none" stroke="#2d7d2d" stroke-width="1.5" marker-end="url(#arrow_2d7d2d)"/><polyline points="140.0,244.0 470.0,244.0" fill="none" stroke="#2d7d2d" stroke-width="2.2" marker-end="url(#arrow_2d7d2d)"/><polyline points="470.0,320.0 820.0,320.0" fill="none" stroke="#2d7d2d" stroke-width="1.5" marker-end="url(#arrow_2d7d2d)"/><polyline points="820.0,362.0 470.0,362.0" fill="none" stroke="#2d7d2d" stroke-width="1.5" marker-end="url(#arrow_2d7d2d)"/><polyline points="470.0,404.0 820.0,404.0" fill="none" stroke="#2d7d2d" stroke-width="2.2" marker-end="url(#arrow_2d7d2d)"/><polyline points="820.0,516.0 1132.0,516.0" fill="none" stroke="#2d7d2d" stroke-width="2.2" marker-end="url(#arrow_2d7d2d)"/><polyline points="820.0,558.0 470.0,558.0" fill="none" stroke="#2d7d2d" stroke-width="1.5" marker-end="url(#arrow_2d7d2d)"/><polyline points="470.0,600.0 140.0,600.0" fill="none" stroke="#2d7d2d" stroke-width="1.5" marker-end="url(#arrow_2d7d2d)"/><polyline points="140.0,644.0 1132.0,644.0" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow_333333)"/><rect x="20" y="12" width="1240" height="44" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:44px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">With socks5h the phone, not the cloud, resolves the name: the cloud listener reads only the destination, forwards the SOCKS5 bytes unchanged, and after one success reply the stream is a plain byte pipe</div></div></foreignObject><rect x="30" y="70" width="220" height="46" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="30" y="70" width="220" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:220px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">AGENT TOOL<br/>(SOCKS5 client)</div></div></foreignObject><rect x="360" y="70" width="220" height="46" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="360" y="70" width="220" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:220px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">PASSTHROUGH LISTENER<br/>localhost:10080 [I8]</div></div></foreignObject><rect x="710" y="70" width="220" height="46" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="710" y="70" width="220" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:220px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">PHONE<br/>(SOCKS5 server + resolver)</div></div></foreignObject><rect x="1022" y="70" width="220" height="46" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><foreignObject x="1022" y="70" width="220" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:220px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">WEB SITE</div></div></foreignObject><rect x="30" y="122" width="300" height="18" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="122" width="300" height="18"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:18px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#6c8ebf;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">cloud instance</div></div></foreignObject><rect x="660" y="122" width="300" height="18" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="660" y="122" width="300" height="18"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:18px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#82b366;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">user&#x27;s network</div></div></foreignObject><rect x="139" y="159" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="469" y="159" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="469" y="201" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="139" y="201" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="139" y="243" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="469" y="243" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="469" y="319" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="819" y="319" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="819" y="361" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="469" y="361" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="469" y="403" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="819" y="403" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="819" y="515" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="1131" y="515" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="819" y="557" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="469" y="557" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="469" y="599" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="139" y="599" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="310" y="256" width="320" height="34" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="310" y="256" width="320" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:320px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">the listener parses the destination only, for the cloud deny list (C1); the name is up to 255 octets [P7]</div></div></foreignObject><rect x="670" y="418" width="300" height="62" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="670" y="418" width="300" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:62px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">7  RESOLVES THE NAME with the phone&#x27;s own resolver -&gt; the server a local user would get; destination filter on the RESOLVED address (no private ranges, ports 80/443 [I9]), then connects to that exact address</div></div></foreignObject><rect x="139" y="643" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="1131" y="643" width="2" height="2" rx="0" fill="none" stroke="none" stroke-width="1.5"/><rect x="30" y="680" width="1220" height="20" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="680" width="1220" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:20px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">THE ONE LETTER THAT MATTERS: the client URL decides who resolves the name (curl documentation; RFC 1928 allows both)</div></div></foreignObject><rect x="30" y="704" width="600" height="62" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="30" y="704" width="600" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:62px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">socks5://  -  the CLIENT resolves, in the cloud<br/>CONNECT carries ATYP 0x01 IPv4 (10 bytes) or 0x04 IPv6 (22 bytes) with an address. The DNS answer was picked for the cloud region, so the phone connects to a server far from the user: exit address and server choice disagree.</div></div></foreignObject><rect x="650" y="704" width="600" height="62" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="650" y="704" width="600" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:62px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">socks5h://  -  the PROXY resolves, on the phone (chosen)<br/>CONNECT carries ATYP 0x03 with the name. The phone&#x27;s resolver picks the server a local user gets: exit address and server choice agree, and no separate DNS proxy is needed. The browser spells this socks5:// (it always resolves on the proxy side).</div></div></foreignObject><rect x="30" y="778" width="1220" height="40" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="778" width="1220" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Failure replies from the phone [P6]:  0x02 = filter refused (the proxy&#x27;s own policy, not the site)  |  0x04 = name did not resolve  |  0x05 = the site refused TCP  |  0x01 = general failure (also the listener&#x27;s answer when the tunnel has no free stream).</div></div></foreignObject><rect x="30" y="830" width="1220" height="26" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="830" width="1220" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend: bold arrows carry the destination NAME or open a connection | green = cloud-&gt;phone path | blue lanes = cloud instance | green lanes = user&#x27;s network | grey = notes. Bytes shown as hex.</div></div></foreignObject><rect x="30" y="870" width="1220" height="197" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="870" width="1220" height="197"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:197px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Every number is loaded from ../constants.json by the key shown. [Pn] = public (an RFC or other public document, or my arithmetic on one); [In] = illustrative (a design parameter or a round value of the right order; never a measurement of a real deployment); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/B1-socks5-in-ten-minutes.md (two exchanges, field layouts, reply codes, socks5 vs socks5h, passthrough); notes/A1-the-end-to-end-picture.md (one request end to end; browser socks5:// spelling); notes/C1-threat-model.md (filter after DNS, on the exact address). In 1 the &#x27;01&#x27; is NMETHODS = 1 and the &#x27;00&#x27; in 3 is RSV; L = name length.<br/>[P1] socks5_version = 5 VER byte (0x05). public: RFC 1928 §3<br/>[P2] socks5_methods = {no_auth: 0x00, gssapi: 0x01, username_password: 0x02, no_acceptable_methods: 0xFF} METHOD byte. public: RFC 1928 §3<br/>[P3] socks5_commands = {connect: 0x01, bind: 0x02, udp_associate: 0x03} CMD byte. public: RFC 1928 §4<br/>[P4] socks5_atyp = {ipv4: 0x01, domain: 0x03, ipv6: 0x04} ATYP byte. public: RFC 1928 §4-5<br/>[P5] socks5_message_sizes = {method_request_one_method: 3, method_reply: 2, connect_ipv4: 10, connect_ipv6: 22, connect_domain: 7 + L (L = name length), reply_ipv4: 10} bytes. public: my arithmetic from the field layouts in RFC 1928 §3-6 (VER, CMD/REP, RSV, ATYP, address, 2-byte port)<br/>[P6] socks5_reply_codes = {0x00: succeeded, 0x01: general SOCKS server failure, 0x02: connection not allowed by ruleset, 0x03: network unreachable, 0x04: host unreachable, 0x05: connection refused, 0x06: TTL expired, 0x07: command not supported, 0x08: address type not supported} REP byte. public: RFC 1928 §6<br/>[P7] socks5_domain_max_len = 255 octets. public: RFC 1928 §5: the domain name is prefixed by a one-octet length<br/>[I8] socks_listen_port_illustrative = 10080 TCP port bound to localhost. illustrative: design parameter; chosen away from socks5_conventional_port to avoid clashes with other software<br/>[I9] allowed_ports_illustrative = [80, 443] destination TCP ports allowed by the phone filter. illustrative: design parameter: the HTTP and HTTPS well-known ports only (first release)</div></div></foreignObject><line x1="140" y1="116" x2="140" y2="664" stroke="#999999" stroke-width="1.2" stroke-dasharray="6,4"/><line x1="470" y1="116" x2="470" y2="256" stroke="#999999" stroke-width="1.2" stroke-dasharray="6,4"/><line x1="820" y1="116" x2="820" y2="418" stroke="#999999" stroke-width="1.2" stroke-dasharray="6,4"/><line x1="1132" y1="116" x2="1132" y2="664" stroke="#999999" stroke-width="1.2" stroke-dasharray="6,4"/><line x1="645" y1="120" x2="645" y2="664" stroke="#82b366" stroke-width="2"/><line x1="470" y1="290" x2="470" y2="664" stroke="#999999" stroke-width="1.2" stroke-dasharray="6,4"/><line x1="820" y1="480" x2="820" y2="664" stroke="#999999" stroke-width="1.2" stroke-dasharray="6,4"/><foreignObject x="148.0" y="139.0" width="314" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">1  method request  0x05 01 0x00  (3 bytes) [P1][P2][P5]</span></div></foreignObject><foreignObject x="148.0" y="181.0" width="314" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">2  method reply  0x05 0x00  (2 bytes): the listener answers this itself</span></div></foreignObject><foreignObject x="85.0" y="223.0" width="440" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">3  CONNECT  0x05 0x01 00 ATYP 0x03 len name port  (7 + L bytes) [P3][P4]</span></div></foreignObject><foreignObject x="478.0" y="299.0" width="334" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">4  open a new QUIC stream; forward the original method request</span></div></foreignObject><foreignObject x="478.0" y="341.0" width="334" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">5  method reply 0x05 0x00</span></div></foreignObject><foreignObject x="478.0" y="383.0" width="334" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">6  forward the original CONNECT bytes unchanged (still the NAME)</span></div></foreignObject><foreignObject x="828.0" y="495.0" width="296" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">8  TCP connect from the phone&#x27;s address</span></div></foreignObject><foreignObject x="478.0" y="537.0" width="334" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">9  reply REP 0x00 succeeded (10 bytes) [P6]</span></div></foreignObject><foreignObject x="148.0" y="579.0" width="314" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">10  reply passed to the tool unchanged</span></div></foreignObject><foreignObject x="156.0" y="623.0" width="960" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#333333;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">11  TLS 1.3 + HTTP, end to end between tool and site: the QUIC stream is now a byte pipe; listener and phone see only TLS records</span></div></foreignObject></svg>