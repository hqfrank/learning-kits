<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750"><rect x="0" y="0" width="1280" height="750" fill="#ffffff"/><defs><marker id="arrow_2d7d2d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#2d7d2d"/></marker><marker id="arrow_666666" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker><marker id="arrow_7b4f9e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#7b4f9e"/></marker></defs><polyline points="300.0,146.0 330.0,150.0" fill="none" stroke="#2d7d2d" stroke-width="2.2" marker-end="url(#arrow_2d7d2d)"/><polyline points="450.0,210.0 450.0,262.0" fill="none" stroke="#2d7d2d" stroke-width="2.2" marker-end="url(#arrow_2d7d2d)"/><polyline points="885.0,310.2 800.0,317.0" fill="none" stroke="#2d7d2d" stroke-width="2.2" marker-end="url(#arrow_2d7d2d)"/><polyline points="630.0,317.0 570.0,312.0" fill="none" stroke="#2d7d2d" stroke-width="2.2" marker-end="url(#arrow_2d7d2d)"/><polyline points="885.0,438.0 810.0,427.5" fill="none" stroke="#7b4f9e" stroke-width="1.5" marker-end="url(#arrow_7b4f9e)"/><polyline points="630.0,427.5 570.0,427.5" fill="none" stroke="#7b4f9e" stroke-width="1.5" marker-end="url(#arrow_7b4f9e)"/><polyline points="1075.0,299.6 1185.0,290.0 1185.0,260.0" fill="none" stroke="#2d7d2d" stroke-width="2.2" marker-end="url(#arrow_2d7d2d)"/><polyline points="570.0,135.0 630.0,139.5" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_666666)"/><rect x="20" y="12" width="1240" height="44" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:44px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">Two paths, both dialled by the phone: HTTPS tells it where the tunnel is and which certificate to trust; QUIC carries one stream per tool TCP connection, and the site sees the phone&#x27;s address</div></div></foreignObject><rect x="30" y="70" width="560" height="420" rx="8" fill="none" stroke="#6c8ebf" stroke-width="2" stroke-dasharray="6,4"/><foreignObject x="30" y="70" width="560" height="420"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:560px;height:420px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#6c8ebf;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">CLOUD SIDE: the agent instance sits in a private subnet</div></div></foreignObject><rect x="610" y="70" width="220" height="420" rx="8" fill="none" stroke="#d79b00" stroke-width="2" stroke-dasharray="6,4"/><foreignObject x="610" y="70" width="220" height="420"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:220px;height:420px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#d79b00;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">PUBLIC EDGE</div></div></foreignObject><rect x="850" y="70" width="240" height="420" rx="8" fill="none" stroke="#82b366" stroke-width="2" stroke-dasharray="6,4"/><foreignObject x="850" y="70" width="240" height="420"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:240px;height:420px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#82b366;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">USER&#x27;S NETWORK</div></div></foreignObject><rect x="50" y="110" width="250" height="90" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="50" y="110" width="250" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:250px;height:90px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">AGENT TOOL (curl, an HTTP library)<br/>reads ALL_PROXY = socks5h://localhost:10080 [I1]<br/>set once at boot; speaks SOCKS5 to the listener; no tool code changes</div></div></foreignObject><rect x="50" y="240" width="250" height="100" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="50" y="240" width="250" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:250px;height:100px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">NO_PROXY list: localhost, the metadata address 169.254.169.254 [P7], internal suffixes, the model API and cloud APIs<br/>-&gt; these never go through the phone</div></div></foreignObject><rect x="330" y="110" width="240" height="100" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="330" y="110" width="240" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:240px;height:100px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">PASSTHROUGH LISTENER<br/>localhost:10080 [I1], always up<br/>reads CONNECT only for a deny list, then forwards the SOCKS5 bytes unchanged</div></div></foreignObject><rect x="330" y="262" width="240" height="100" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="330" y="262" width="240" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:240px;height:100px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">QUIC SERVER  UDP :4433 [I2]<br/>private ALPN socks5-over-quic<br/>self-signed certificate made at boot<br/>opens 1 stream per tool connection</div></div></foreignObject><rect x="330" y="385" width="240" height="85" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="330" y="385" width="240" height="85"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:240px;height:85px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ASSISTANT SERVICE API<br/>existing HTTPS chat API, user login<br/>config endpoint: host, port, fingerprint, ALPN, single-use token</div></div></foreignObject><rect x="630" y="105" width="180" height="115" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4"/><foreignObject x="630" y="105" width="180" height="115"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:180px;height:115px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">SITE REACHED DIRECT<br/>from the cloud address (no phone connected, or a NO_PROXY match): sees a data-centre IP</div></div></foreignObject><rect x="630" y="257" width="170" height="120" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="630" y="257" width="170" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:170px;height:120px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ANYCAST UDP FRONT DOOR<br/>static public 203.0.113.x [P9]; one public port per instance from 20000-29999 [I3]; deny-by-default; does NOT filter sources</div></div></foreignObject><rect x="630" y="385" width="180" height="85" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="630" y="385" width="180" height="85"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:180px;height:85px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">HTTPS TUNNEL PROVIDER for the control channel (TCP only: cannot carry the UDP data path)</div></div></foreignObject><rect x="870" y="105" width="200" height="115" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="870" y="105" width="200" height="115"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:115px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">HOME OR CARRIER NAT<br/>sees only an outbound UDP flow; no port forwarding. Keepalive every 10 s [I5] stays under the 30 s NAT assumption [P6]</div></div></foreignObject><rect x="885" y="257" width="190" height="213" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="885" y="257" width="190" height="213"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:213px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">PHONE APP (in the foreground, during a chat)<br/><br/>1  calls the config endpoint over HTTPS<br/>2  dials QUIC, checks the pinned fingerprint and ALPN<br/>3  SOCKS5 server: resolves the name with its own resolver<br/>4  destination filter: no private ranges; ports 80/443 [I8] only<br/>5  opens TCP from the phone&#x27;s address</div></div></foreignObject><rect x="1110" y="105" width="150" height="155" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/><foreignObject x="1110" y="105" width="150" height="155"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:155px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">WEB SITE<br/>sees the PHONE&#x27;s address; the DNS answer was picked for the phone&#x27;s location (socks5h)</div></div></foreignObject><rect x="30" y="507" width="1230" height="44" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="507" width="1230" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1230px;height:44px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend:  green bold arrows = the data path (QUIC over UDP, then TCP from the phone)  |  purple = the control channel (HTTPS over TCP, the app&#x27;s existing login)  |  grey dashed = direct connection from the cloud address  |  blue = cloud instance  |  amber = public edge  |  green boxes = user&#x27;s network.  The two paths share no state. Arrows point the way each connection is dialled.</div></div></foreignObject><rect x="30" y="562" width="1230" height="172" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="562" width="1230" height="172"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1230px;height:172px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Every number is loaded from ../constants.json by the key shown. [Pn] = public (an RFC or other public document, or my arithmetic on one); [In] = illustrative (a design parameter or a round value of the right order; never a measurement of a real deployment); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/A1-the-end-to-end-picture.md (two paths, one request, static environment, NO_PROXY, direct fallback); notes/B3-who-dials-whom.md (phone dials out, cloud opens streams, port map, no source filter, NAT keepalive); B4 (pin, ALPN); B5 (config call, token); C1 (phone destination filter). Front-door address: only the first three octets of a documentation range are shown.<br/>[I1] socks_listen_port_illustrative = 10080 TCP port bound to localhost. illustrative: design parameter; chosen away from socks5_conventional_port to avoid clashes with other software<br/>[I2] quic_listen_port_illustrative = 4433 UDP port on the cloud instance. illustrative: design parameter (a common QUIC example port)<br/>[I3] front_door_port_range_illustrative = [20000, 29999] public UDP ports on the anycast front door. illustrative: design parameter: one static public port per private instance<br/>[I4] phone_max_incoming_streams_illustrative = 64 concurrent server-initiated bidirectional streams. illustrative: design parameter: the effective concurrency cap of the whole tunnel<br/>[I5] keepalive_illustrative = 10 s. illustrative: design parameter: below udp_nat_idle_assumption and below one third of conn_idle_timeout_illustrative<br/>[P6] udp_nat_idle_assumption = 30 s. public: RFC 9308 §3.2 (applications can assume a NAT binding may expire after 30 s of inactivity)<br/>[P7] metadata_address = 169.254.169.254 IPv4 address. public: link-local address used by the instance metadata services of several public clouds (provider documentation); inside RFC 3927 169.254.0.0/16<br/>[I8] allowed_ports_illustrative = [80, 443] destination TCP ports allowed by the phone filter. illustrative: design parameter: the HTTP and HTTPS well-known ports only (first release)<br/>[P9] documentation_addresses = {ipv4: [192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24], ipv6: 2001:db8::/32} CIDR. public: RFC 5737; RFC 3849 (all example addresses in this kit come from these ranges)</div></div></foreignObject><foreignObject x="285.0" y="226.0" width="330" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">1 new QUIC stream per tool TCP connection (cap 64 [I4])</span></div></foreignObject><foreignObject x="807.0" y="329.0" width="70" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">QUIC/UDP<br/>phone<br/>dials</span></div></foreignObject><foreignObject x="565.0" y="327.0" width="70" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">port map -&gt;<br/>private :4433</span></div></foreignObject><foreignObject x="817.0" y="445.0" width="50" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#7b4f9e;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">HTTPS</span></div></foreignObject><foreignObject x="1130.0" y="312.0" width="110" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#2d7d2d;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">TCP from the<br/>phone&#x27;s address</span></div></foreignObject><foreignObject x="570.0" y="110.0" width="60" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#666666;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">direct fallback</span></div></foreignObject></svg>