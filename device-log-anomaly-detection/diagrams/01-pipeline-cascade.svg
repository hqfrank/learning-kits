<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690"><rect x="0" y="0" width="1280" height="690" fill="#ffffff"/><defs><marker id="a5f9e4f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#5f9e4f"/></marker><marker id="a6c8ebf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#6c8ebf"/></marker><marker id="a9673a6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#9673a6"/></marker></defs><polyline points="260.0,130.0 300.0,130.0" fill="none" stroke="#9673a6" stroke-width="2" marker-end="url(#a9673a6)"/><polyline points="140.0,218.0 140.0,252.0 657.0,252.0 657.0,218.0" fill="none" stroke="#9673a6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a9673a6)"/><polyline points="1035.0,330.0 282.0,330.0 282.0,180.0 300.0,180.0" fill="none" stroke="#5f9e4f" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a5f9e4f)"/><polyline points="525.0,153.0 545.0,153.0" fill="none" stroke="#6c8ebf" stroke-width="2" marker-end="url(#a6c8ebf)"/><polyline points="770.0,153.0 790.0,153.0" fill="none" stroke="#6c8ebf" stroke-width="2" marker-end="url(#a6c8ebf)"/><polyline points="1015.0,153.0 1035.0,153.0" fill="none" stroke="#6c8ebf" stroke-width="2" marker-end="url(#a6c8ebf)"/><polyline points="1147.5,218.0 1147.5,262.0" fill="none" stroke="#6c8ebf" stroke-width="2" marker-end="url(#a6c8ebf)"/><rect x="20" y="10" width="1240" height="56" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="10" width="1240" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:56px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:20px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Metrics choose which logs to read: a four-stage cascade narrows a fleet's logs to a few flagged windows and one ticket per fault, and an engineer still decides</div></div></foreignObject><rect x="20" y="88" width="240" height="130" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="20" y="88" width="240" height="130"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:240px;height:130px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>A DEVICE</b> [A1]<br/>many components write one interleaved stream<br/>about 500 000 lines [1*] per device-day<br/>ring buffer of 4 MB [2*] overwrites old lines: only hours of history<br/>on-device retention 14 days [3*]<br/>sends metrics (all devices) and logs (on demand)</div></div></foreignObject><rect x="300" y="88" width="225" height="130" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="300" y="88" width="225" height="130"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:225px;height:130px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>1 DETECT a change</b> [B4, A2]<br/>family level: weighted-least-squares slope test on the daily share of devices<br/>device level: isolation forest on device-day metric vectors<br/>out: which metric, which devices, which days</div></div></foreignObject><rect x="545" y="88" width="225" height="130" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="545" y="88" width="225" height="130"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:225px;height:130px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>2 FETCH + PARSE</b> [B1, B2]<br/>fetch logs only of the devices that drive the change, only for that time range<br/>line -&gt; template ID + parameters (a few hundred templates, e.g. 400 templates [4*])<br/>cut windows, count templates per window</div></div></foreignObject><rect x="790" y="88" width="225" height="130" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="790" y="88" width="225" height="130"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:225px;height:130px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>3 SCORE + EXPLAIN</b> [B3, B5]<br/>isolation forest on count vectors -&gt; one score per window<br/>per-thread transition edges -&gt; where the sequence left the normal path<br/>reduction: 20 windows [5*] flagged of 50 000 windows [6*]</div></div></foreignObject><rect x="1035" y="88" width="225" height="130" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="1035" y="88" width="225" height="130"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:225px;height:130px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>4 GROUP + REPORT</b> [B6]<br/>join metric + log anomaly per device-day<br/>hierarchical clustering: one cluster per symptom<br/>rank by devices hit and score; de-duplicate against open tickets; one ticket with the evidence attached</div></div></foreignObject><rect x="300" y="256" width="520" height="20" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="300" y="256" width="520" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:520px;height:20px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#9673a6;padding:2px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">logs: uploaded on demand only (after the fault), kept 60 days [7*] [A1]</div></div></foreignObject><rect x="304" y="220" width="230" height="30" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="304" y="220" width="230" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:230px;height:30px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#6c8ebf;padding:2px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">pass context to stage 2: which metric fired + when (UTC vs device local time) [B5]</div></div></foreignObject><rect x="1035" y="262" width="225" height="90" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="1035" y="262" width="225" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:225px;height:90px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>ENGINEER decides</b> [C4]<br/>anomaly is not issue: confirm with a second signal before a ticket<br/>time per case 90 [8*] -&gt; 15 min [9*]</div></div></foreignObject><rect x="300" y="334" width="720" height="20" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="300" y="334" width="720" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:720px;height:20px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#5f9e4f;padding:2px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">feedback: root-cause label (device defect / environmental / data artefact) -&gt; ground truth [C1] + drop and direction rules [B4]</div></div></foreignObject><rect x="20" y="372" width="600" height="74" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="6,4"/><foreignObject x="20" y="372" width="600" height="74"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:74px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>ON-DEVICE alternative</b> [A0, B3]: a small sequence model (DeepLog-style LSTM, history h = 10 [10], normal if next template in top g = 9 [11]) reads every line before the ring buffer overwrites it, works offline, and raw logs never leave the device. Cost: it must fit the device's memory and power budget.</div></div></foreignObject><rect x="640" y="372" width="620" height="74" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="640" y="372" width="620" height="74"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:620px;height:74px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>FLEET-SIDE (this cascade)</b> [A0, B5]: ample compute, compares many devices, cheap and explainable forest. Sees only uploaded logs and kept time ranges; misses faults that never show in metrics. Started first: lower risk, a working result sooner, a path to a parallel (logs always analysed) form later.</div></div></foreignObject><rect x="20" y="458" width="1240" height="36" rx="0" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.5"/><foreignObject x="20" y="458" width="1240" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:36px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>Legend</b> — purple = the device and on-device work; blue = fleet-side cloud stages; amber = the human decision; green dashed = the feedback loop. Solid arrow = data flow; dashed purple = logs, which arrive only on demand. [A0] etc. = the kit note that explains the box.</div></div></foreignObject><rect x="20" y="506" width="1240" height="170" rx="0" fill="#fff8dc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="20" y="506" width="1240" height="170"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:170px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;"><b>Sources</b> — every number is loaded from ../constants.json. [n] = public (real value, cited); [n*] = illustrative (an invented round number of realistic order of magnitude; never a measurement).<br/>[1*] lines_per_device_day = 500 000 lines — illustrative; (order of magnitude endorsed by the kit brief)<br/>[2*] ring_buffer_size = 4 MB (a few megabytes) — illustrative<br/>[3*] on_device_retention = 14 days — illustrative<br/>[4*] templates_per_component_set = 400 templates — illustrative; ('a few hundred')<br/>[5*] flagged_windows = 20 windows — illustrative<br/>[6*] windows_scanned = 50 000 windows — illustrative<br/>[7*] uploaded_log_retention = 60 days — illustrative<br/>[8*] time_per_case_before = 90 min — illustrative<br/>[9*] time_per_case_after = 15 min — illustrative<br/>[10] deeplog_history_h = 10 log keys — public; Du, Li, Zheng, Srikumar, 'DeepLog', CCS 2017, §5.1.3 defaults<br/>[11] deeplog_top_g = 9 candidates — public; Du, Li, Zheng, Srikumar, 'DeepLog', CCS 2017, §5.1.3 defaults</div></div></foreignObject></svg>