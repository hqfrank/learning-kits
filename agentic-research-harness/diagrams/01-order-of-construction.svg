<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="778" viewBox="0 0 1280 778"><rect x="0" y="0" width="1280" height="778" fill="#ffffff"/><defs><marker id="arrow_666666" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker></defs><polyline points="190.0,178.0 205.0,178.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="365.0,178.0 380.0,178.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="540.0,178.0 555.0,178.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="715.0,178.0 730.0,178.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="890.0,178.0 905.0,178.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="1065.0,178.0 1080.0,178.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><rect x="20" y="12" width="1240" height="40" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">Automate last: by hand the policy call fell 400 -&gt; 100 ms [I1][I2]; the automated loop then found a further 12 % [calc] cheaply (all illustrative)</div></div></foreignObject><rect x="30" y="72" width="510" height="40" rx="8" fill="none" stroke="#9673a6" stroke-width="2" stroke-dasharray="6,4"/><foreignObject x="30" y="72" width="510" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:510px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">CALIBRATE</div></div></foreignObject><rect x="555" y="72" width="510" height="40" rx="8" fill="none" stroke="#82b366" stroke-width="2" stroke-dasharray="6,4"/><foreignObject x="555" y="72" width="510" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:510px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">HAND-RUN</div></div></foreignObject><rect x="1080" y="72" width="160" height="40" rx="8" fill="none" stroke="#d79b00" stroke-width="2" stroke-dasharray="6,4"/><foreignObject x="1080" y="72" width="160" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">AUTOMATE</div></div></foreignObject><rect x="30" y="128" width="160" height="100" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="30" y="128" width="160" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:100px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">1  REFERENCE + BASELINE<br/><br/>port, make it run, benchmark on frozen inputs on several devices (B1)</div></div></foreignObject><rect x="205" y="128" width="160" height="100" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="205" y="128" width="160" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:100px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">2  PROPOSAL<br/><br/>one page: what is optimized, what &#x27;equivalent&#x27; means, who owns the evaluator (B8)</div></div></foreignObject><rect x="380" y="128" width="160" height="100" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="380" y="128" width="160" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:100px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">3  FROZEN EVALUATOR + CONTROLS<br/><br/>build the judge; baseline must pass, cheats must fail (B2, B3)</div></div></foreignObject><rect x="555" y="128" width="160" height="100" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="555" y="128" width="160" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:100px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">4  RESEARCH BY HAND<br/><br/>a coordinating agent gives one bounded question per researcher session; a human watches every round</div></div></foreignObject><rect x="730" y="128" width="160" height="100" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="730" y="128" width="160" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:100px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">5  EVALUATOR HARDENING<br/><br/>each new check answers a failure seen the day before</div></div></foreignObject><rect x="905" y="128" width="160" height="100" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="905" y="128" width="160" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:100px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">6  FIRST REPORT<br/><br/>rebuilt from the evidence records (B4, B8)</div></div></foreignObject><rect x="1080" y="128" width="160" height="100" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="1080" y="128" width="160" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:100px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">7  AUTOMATED LOOP<br/><br/>planner, parallel researchers, queue, promotion policy, memory, cost meter (B7)</div></div></foreignObject><rect x="30" y="240" width="510" height="50" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="240" width="510" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:510px;height:50px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">EXIT: the baseline passes every input set with margin clearly below 1, and every negative control is rejected</div></div></foreignObject><rect x="555" y="240" width="510" height="50" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="555" y="240" width="510" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:510px;height:50px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">EXIT: the evaluator has survived several rounds of real candidates; the lessons file &#x27;writes itself&#x27;</div></div></foreignObject><rect x="1080" y="240" width="160" height="50" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="1080" y="240" width="160" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:50px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">START: small caps, few parallel researchers, cost metered from round one</div></div></foreignObject><rect x="30" y="306" width="400" height="70" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="306" width="400" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:400px;height:70px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHY 1 BEFORE 3<br/>A correctness gate compares the candidate with a trusted output. No reference -&gt; nothing to compare -&gt; the first fast-but-wrong result is accepted.</div></div></foreignObject><rect x="440" y="306" width="400" height="70" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="440" y="306" width="400" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:400px;height:70px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHY BASELINE BEFORE CANDIDATES<br/>In the first campaign the first gate wrongly REJECTED the real baseline. It was found the day the evaluator was built, because the baseline ran before any candidate.</div></div></foreignObject><rect x="850" y="306" width="400" height="70" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="850" y="306" width="400" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:400px;height:70px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHY 4 BEFORE 7<br/>The hand-run rounds showed which prompts, rules and checks the agents need. The loop then encodes a process that already works; automating earlier automates the wrong prompts.</div></div></foreignObject><rect x="30" y="394" width="1220" height="24" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="394" width="1220" height="24"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:24px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">THE SHAPE OF THE FIRST CAMPAIGN (illustrative values that keep the shape, not the campaign&#x27;s values). Bar length is to scale: latency of one policy call.</div></div></foreignObject><rect x="30" y="426" width="880" height="34" rx="0" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><rect x="920" y="426" width="300" height="34" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="920" y="426" width="300" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">start: 400 ms [I1]</div></div></foreignObject><rect x="30" y="472" width="220" height="34" rx="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><rect x="260" y="472" width="300" height="34" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="260" y="472" width="300" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">after hand-run rounds: 100 ms [I2]</div></div></foreignObject><rect x="560" y="472" width="690" height="34" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="560" y="472" width="690" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:690px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">-75 % [calc] in 3 days [I4], about 12 researcher sessions [I5]: people steering agents found the big gains</div></div></foreignObject><rect x="30" y="518" width="193" height="34" rx="0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><rect x="233" y="518" width="300" height="34" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="233" y="518" width="300" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">after automated loop: 88 ms [I3]</div></div></foreignObject><rect x="560" y="518" width="690" height="34" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="560" y="518" width="690" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:690px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">a further -12 % [calc] in 5 rounds [I6] for about 50 USD of model usage [I7]: the loop found smaller, harder gains cheaply</div></div></foreignObject><rect x="30" y="572" width="1220" height="40" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="572" width="1220" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend:  dashed frames = phases (note A1 table)  |  purple = human-owned  |  amber = the judge  |  green = agent work  |  blue = records / data  |  grey = why the order matters  |  bars: red = start, green = after hand-run, amber = after automation. Steps run left to right; each needs the one before it.</div></div></foreignObject><rect x="30" y="626" width="1220" height="136" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="626" width="1220" height="136"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:136px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Every number is loaded from ../constants.json by the key shown. [Pn] = public (cited paper, or my arithmetic on public mathematics); [In] = illustrative (a design parameter of the harness, a round value that keeps the shape of the first campaign, or output of the demonstration scheduling simulator; never a measurement of a real platform); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/A1-the-order-of-construction.md (seven steps, three dependencies, phase table, illustrative campaign shape); notes/C5-the-checklist.md; B1-B4, B7, B8 for each step. [calc]: -75 % = (400 - 100) / 400; -12 % = (100 - 88) / 100.<br/>[I1] c1_baseline_ms_illustrative = 400 ms. illustrative; keeps the shape of the first campaign (internal methodology notes, 2026), not its values<br/>[I2] c1_after_handrun_ms_illustrative = 100 ms. illustrative; keeps the shape of the first campaign (internal methodology notes, 2026), not its values<br/>[I3] c1_after_auto_ms_illustrative = 88 ms. illustrative; keeps the shape of the first campaign (internal methodology notes, 2026), not its values<br/>[I4] c1_handrun_days_illustrative = 3 days. illustrative; keeps the shape of the first campaign (internal methodology notes, 2026), not its values<br/>[I5] c1_handrun_sessions_illustrative = 12 researcher sessions. illustrative; keeps the shape of the first campaign (internal methodology notes, 2026), not its values<br/>[I6] c1_auto_rounds_illustrative = 5 rounds. illustrative; keeps the shape of the first campaign (internal methodology notes, 2026), not its values<br/>[I7] c1_auto_spend_usd_illustrative = 50 USD. illustrative; keeps the shape of the first campaign (internal methodology notes, 2026), not its values</div></div></foreignObject></svg>