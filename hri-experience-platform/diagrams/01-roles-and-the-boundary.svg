<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="771" viewBox="0 0 1280 771"><rect x="0" y="0" width="1280" height="771" fill="#ffffff"/><defs><marker id="arrow_666666" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker><marker id="arrow_6c8ebf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#6c8ebf"/></marker><marker id="arrow_82b366" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#82b366"/></marker><marker id="arrow_9673a6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#9673a6"/></marker><marker id="arrow_d79b00" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#d79b00"/></marker></defs><polyline points="140.0,217.0 170.0,217.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow_666666)"/><polyline points="170.0,253.0 140.0,253.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow_666666)"/><polyline points="420.0,160.0 515.0,160.0" fill="none" stroke="#9673a6" stroke-width="2.2" marker-end="url(#arrow_9673a6)"/><polyline points="515.0,220.0 420.0,220.0" fill="none" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><polyline points="545.0,246.0 545.0,334.0" fill="none" stroke="#d79b00" stroke-width="2.2" marker-end="url(#arrow_d79b00)"/><polyline points="935.0,334.0 935.0,246.0" fill="none" stroke="#82b366" stroke-width="2.2" marker-end="url(#arrow_82b366)"/><polyline points="965.0,150.0 1010.0,150.0" fill="none" stroke="#d79b00" stroke-width="2.2" marker-end="url(#arrow_d79b00)"/><polyline points="1010.0,225.0 965.0,225.0" fill="none" stroke="#6c8ebf" stroke-width="2.2" marker-end="url(#arrow_6c8ebf)"/><polyline points="1250.0,151.0 1266.0,151.0 1266.0,321.0 1250.0,321.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="1082.0,290.0 1082.0,270.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="1130.0,352.0 1130.0,374.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><rect x="20" y="12" width="1240" height="48" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:48px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">The reasoner proposes, only the coordinator invokes: one shared kernel owns every authority, and each experience owns only its story, reached through one small effect vocabulary</div></div></foreignObject><rect x="30" y="190" width="110" height="90" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="190" width="110" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:110px;height:90px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">VISITOR<br/>at a public<br/>demo stand</div></div></foreignObject><rect x="170" y="80" width="250" height="310" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="170" y="80" width="250" height="310"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:250px;height:310px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">THE REASONER<br/>(a realtime speech-to-speech LLM session)<br/><br/>OWNS everything said inside a phase: wording, tone, empathy, small detours<br/><br/>MAY propose a physical act, as a typed intent from a closed list (its one tool)<br/><br/>GETS a small per-phase context, e.g. &#x27;this is the greeting; a wave is available&#x27;. It is never told it is bounded.<br/><br/>RETURNS a turn result: typed intent + terminal speech status<br/><br/>CHAT = bounded turns: 3 turns [I1] x 8 s [I2] = 24 s [calc] inside a 60 s session bound [I3]; one speech-output lease per turn</div></div></foreignObject><rect x="500" y="72" width="480" height="362" rx="8" fill="none" stroke="#d79b00" stroke-width="2" stroke-dasharray="6,4"/><rect x="510" y="76" width="460" height="34" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="510" y="76" width="460" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:460px;height:34px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">THE COORDINATOR = kernel + the selected experience. Deterministic code, one worker, one authoritative transition at a time. Only it invokes anything.</div></div></foreignObject><rect x="515" y="116" width="450" height="130" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="515" y="116" width="450" height="130"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:450px;height:130px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">COORDINATOR KERNEL  (shared by every experience)<br/><br/>owns: event admission and ordering | correlation | participant authority (who the visitor is) | safety preemption | command authority, leases and the visitor-audio permit | timer mechanics | cleanup and the proof that every store is clean | the lifecycle | evidence</div></div></foreignObject><rect x="603" y="262" width="280" height="56" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="603" y="262" width="280" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:280px;height:56px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">EFFECT VOCABULARY - the only way out:<br/>invoke primitive | cancel primitive | start / cancel timer | request completion cleanup | report to operator</div></div></foreignObject><rect x="515" y="334" width="450" height="86" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="515" y="334" width="450" height="86"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:450px;height:86px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">SELECTED EXPERIENCE  (one per coordinator process)<br/>pure reducer: (local state, read-only envelope, event) -&gt; (next local state, ordered effects)<br/>owns: its local story state, transition matrix, story invariants, and its own timeout, retry and participant POLICY choices</div></div></foreignObject><rect x="1010" y="116" width="240" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="1010" y="116" width="240" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:240px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">PRIMITIVE CATALOG (out)<br/>every behaviour, speech act, gaze request and session service an experience may invoke</div></div></foreignObject><rect x="1010" y="200" width="240" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="1010" y="200" width="240" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:240px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">INPUT CATALOG (in)<br/>every input: ingress kind, payload, correlation, privacy, replay policy</div></div></foreignObject><rect x="1010" y="290" width="240" height="62" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="1010" y="290" width="240" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:240px;height:62px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">PER-TARGET CONTRACTS<br/>adapters (for primitives) and producers (for inputs), one per named target</div></div></foreignObject><rect x="1010" y="374" width="240" height="46" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="1010" y="374" width="240" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:240px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">TARGETS<br/>simulation | physical robot</div></div></foreignObject><rect x="30" y="448" width="600" height="72" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="30" y="448" width="600" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:72px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHAT EACH SIDE MAY NEVER DO<br/>An experience cannot call the robot middleware, the behaviour library, the browser, a model, the clock, the file system or the network (A0).<br/>The reasoner has no motion tool; its tool, context and ability sets are empty and it gets no camera images; its output never selects an experience, a state, a primitive or a command (A1, B6).</div></div></foreignObject><rect x="650" y="448" width="600" height="72" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="650" y="448" width="600" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:72px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHAT THE KERNEL BUYS<br/>A single-experience coordinator named story actions directly: an effect list of about 30 kinds [I4]. The kernel replaces it with the handful of generic effects above plus the two catalogs. A new experience that recombines registered parts is an authoring task, with no kernel change (A0).</div></div></foreignObject><rect x="30" y="532" width="1220" height="48" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="532" width="1220" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:48px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">REJECTED ALTERNATIVES (A0):  one coordinator process per experience (safety and cleanup diverge)  |  one large reducer with configuration branches (one matrix for unrelated stories)  |  a workflow language (validation becomes an interpreter)  |  runtime plug-ins (weakens pinning and review)  |  an LLM that orchestrates at run time (model output cannot own safety, cleanup, identity or physical authority)</div></div></foreignObject><rect x="30" y="592" width="1220" height="40" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="592" width="1220" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend:  purple = the reasoner  |  amber = the kernel and its authority  |  green = the experience (story only)  |  blue = catalogs, per-target contracts, targets  |  red = never allowed  |  dashed frame = the coordinator. Thick arrows = the path of one proposed act.</div></div></foreignObject><rect x="30" y="644" width="1220" height="111" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="644" width="1220" height="111"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:111px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Mechanisms: this kit&#x27;s notes/ (named per line below) and glossary.md. Every number is loaded from ../constants.json by the key shown: [Pn] = public (cited); [In] = illustrative (a round design parameter that keeps the design&#x27;s relations; never a measurement of any system); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/A0-one-experience-versus-many.md (kernel concerns, rejected alternatives, vocabulary shrink); A1-the-reasoner-and-the-coordinator.md (ownership table, proposal path); B1 (reducer signature); B3-the-effect-vocabulary.md (effect table); B5 (catalogs, targets); B6-conversation-and-model-boundaries.md (capability and output boundaries, bounded turns). [calc]: 24 s = 3 turns x 8 s; it fits inside the 60 s session bound.<br/>[I1] chat_turns_illustrative = 3 turns. illustrative: design parameter; bounded number of conversation turns in the example chat experience<br/>[I2] chat_turn_budget_s_illustrative = 8 s. illustrative: design parameter; per-turn time budget for one conversation turn<br/>[I3] chat_session_bound_s_illustrative = 60 s. illustrative: design parameter; upper bound on one kernel-owned conversation session<br/>[I4] old_effect_kinds_illustrative = 30 effect kinds. illustrative order of magnitude of a story-specific effect vocabulary in a single-experience coordinator, before the generic vocabulary replaced it</div></div></foreignObject><foreignObject x="130.0" y="195.0" width="50" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#666666;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">speech</span></div></foreignObject><foreignObject x="130.0" y="256.0" width="50" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#666666;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">speech</span></div></foreignObject><foreignObject x="420.0" y="111.5" width="84" height="49"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold;color:#9673a6;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">typed intent<br/>(a proposal,<br/>never a command)</span></div></foreignObject><foreignObject x="420.0" y="183.0" width="84" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#d79b00;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">phase context;<br/>&#x27;not now&#x27;</span></div></foreignObject><foreignObject x="524.0" y="273.0" width="72" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold;color:#d79b00;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">admitted,<br/>ordered event</span></div></foreignObject><foreignObject x="886.0" y="265.5" width="72" height="49"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">effects<br/>(validated<br/>before commit)</span></div></foreignObject><foreignObject x="958.0" y="119.0" width="60" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold;color:#d79b00;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">dispatch<br/>(after commit)</span></div></foreignObject><foreignObject x="963.0" y="202.5" width="50" height="19"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold;color:#6c8ebf;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">events</span></div></foreignObject><foreignObject x="1030.0" y="353.5" width="200" height="19"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#6c8ebf;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">commands out, observations in</span></div></foreignObject></svg>