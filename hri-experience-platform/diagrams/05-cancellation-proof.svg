<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="777" viewBox="0 0 1280 777"><rect x="0" y="0" width="1280" height="777" fill="#ffffff"/><defs><marker id="arrow_666666" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker><marker id="arrow_82b366" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#82b366"/></marker><marker id="arrow_b85450" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b85450"/></marker></defs><polyline points="220.0,337.0 250.0,337.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="470.0,337.0 500.0,337.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="600.0,302.0 600.0,277.0 740.0,277.0" fill="none" stroke="#82b366" stroke-width="2.2" marker-end="url(#arrow_82b366)"/><polyline points="600.0,372.0 600.0,387.0 740.0,387.0" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrow_b85450)"/><polyline points="990.0,387.0 1020.0,387.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="1135.0,352.0 1135.0,302.0" fill="none" stroke="#82b366" stroke-width="2.2" marker-end="url(#arrow_82b366)"/><polyline points="1135.0,422.0 1135.0,452.0" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrow_b85450)"/><rect x="20" y="12" width="1240" height="48" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:48px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">Cancelling is not releasing: claims are kept until positive quiescence proof, and every settle bound (1500 ms [I1]) sits inside the catalog ceiling and well inside the cleanup deadline (illustrative values)</div></div></foreignObject><rect x="30" y="66" width="1220" height="22" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="66" width="1220" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:22px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">TO SCALE (one axis, 94 px per second): the three bounds a cancellation lives inside</div></div></foreignObject><rect x="30" y="96" width="254" height="26" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="96" width="254" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:254px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:right;overflow:hidden;"><div style="width:100%;">target settle bound 1500 ms [I1]</div></div></foreignObject><rect x="290" y="96" width="141" height="26" rx="0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><rect x="30" y="130" width="254" height="26" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="130" width="254" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:254px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:right;overflow:hidden;"><div style="width:100%;">catalog-wide ceiling 2000 ms [I2]</div></div></foreignObject><rect x="290" y="130" width="188" height="26" rx="0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><rect x="30" y="164" width="254" height="26" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="164" width="254" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:254px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:right;overflow:hidden;"><div style="width:100%;">cleanup acknowledgement deadline 10 000 ms [I3]</div></div></foreignObject><rect x="290" y="164" width="940" height="26" rx="0" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><rect x="260" y="208" width="60" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="260" y="208" width="60" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:60px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">0 s</div></div></foreignObject><rect x="448" y="208" width="60" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="448" y="208" width="60" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:60px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">2 s</div></div></foreignObject><rect x="636" y="208" width="60" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="636" y="208" width="60" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:60px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">4 s</div></div></foreignObject><rect x="824" y="208" width="60" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="824" y="208" width="60" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:60px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">6 s</div></div></foreignObject><rect x="1012" y="208" width="60" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="1012" y="208" width="60" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:60px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">8 s</div></div></foreignObject><rect x="1200" y="208" width="60" height="16" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="1200" y="208" width="60" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:60px;height:16px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">10 s</div></div></foreignObject><rect x="498" y="98" width="560" height="50" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="498" y="98" width="560" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:560px;height:50px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Relation the design relies on: settle bound &lt;= ceiling &lt; cleanup deadline. Settle deadline = the EARLIER of (request time + settle bound) and any active cleanup deadline, so a cancellation never extends cleanup.</div></div></foreignObject><rect x="30" y="302" width="190" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="30" y="302" width="190" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">CANCEL PRIMITIVE<br/>targets the original invocation (no separate &#x27;stop&#x27; primitive); idempotent</div></div></foreignObject><rect x="250" y="302" width="220" height="70" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="250" y="302" width="220" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:220px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">SETTLING<br/>every claim still held; the adapter must produce quiescence proof</div></div></foreignObject><rect x="500" y="302" width="200" height="70" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="500" y="302" width="200" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">positive proof before the settle deadline?</div></div></foreignObject><rect x="740" y="252" width="250" height="50" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="740" y="252" width="250" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:250px;height:50px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">RELEASE ALL the invocation&#x27;s claims, at once</div></div></foreignObject><rect x="740" y="352" width="250" height="70" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="740" y="352" width="250" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:250px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">FORCED CLEANUP, reason &#x27;cancellation stuck&#x27;: keep every claim, refuse conflicting work</div></div></foreignObject><rect x="1020" y="352" width="230" height="70" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="1020" y="352" width="230" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:230px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">quiescence proved before the cleanup deadline?</div></div></foreignObject><rect x="1020" y="252" width="230" height="50" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="1020" y="252" width="230" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:230px;height:50px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">release, normal cleanup completes</div></div></foreignObject><rect x="1020" y="452" width="230" height="64" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="1020" y="452" width="230" height="64"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:230px;height:64px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">RECOVERY (B2): claims stay in evidence, admission off, until operator recovery or a proven clean restart</div></div></foreignObject><rect x="30" y="452" width="470" height="76" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="30" y="452" width="470" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:470px;height:76px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHAT COUNTS AS PROOF (each completion contract defines it)<br/>- physical action: terminal, and no longer holds the action slot<br/>- gaze lease: the gaze clear is acknowledged<br/>- speech stream: stopped or completed, AND its stop acknowledgement succeeded</div></div></foreignObject><rect x="520" y="452" width="470" height="76" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="520" y="452" width="470" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:470px;height:76px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHAT IS NOT PROOF<br/>lease expiry | readiness loss | adapter removal | a transport disconnect.<br/>Lease expiry only stops further forwarding of audio; the claim stays held until the stream proves it stopped.</div></div></foreignObject><rect x="30" y="540" width="1220" height="44" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="30" y="540" width="1220" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:44px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">KERNEL REVOCATIONS ARE UNCONDITIONAL: safety and reset, readiness loss, participant departure, cleanup and generation change cancel every primitive on every target. A catalog entry may add STRICTER revokers; it cannot remove or reorder these (B3).</div></div></foreignObject><rect x="30" y="596" width="1220" height="40" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="596" width="1220" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend:  bar lengths are to scale (one shared axis)  |  green = the experience&#x27;s request and the clean exits  |  amber = kernel-held settlement  |  red = deadlines, non-proof, recovery  |  white = the kernel&#x27;s checks.</div></div></foreignObject><rect x="30" y="650" width="1220" height="111" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="650" width="1220" height="111"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:111px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Mechanisms: this kit&#x27;s notes/ (named per line below) and glossary.md. Every number is loaded from ../constants.json by the key shown: [Pn] = public (cited); [In] = illustrative (a round design parameter that keeps the design&#x27;s relations; never a measurement of any system); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/B3-the-effect-vocabulary.md (cancellation proof, settle bound, ceiling, settle deadline, forced cleanup &#x27;cancellation stuck&#x27;, non-proof list, unconditional revocations); B2-state-ownership.md (cleanup failure enters recovery). Bars: length = value x 0.094 px/ms (drawing scale).<br/>[I1] cancel_settle_target_ms_illustrative = 1500 ms. illustrative: design parameter; one target adapter&#x27;s bound for positive proof that a cancelled primitive is quiet. Must be &lt;= cancel_settle_ceiling_ms_illustrative and &lt; cleanup_ack_timeout_ms_illustrative<br/>[I2] cancel_settle_ceiling_ms_illustrative = 2000 ms. illustrative: design parameter; catalog-wide ceiling pinned in the deployment profile, shared by every target<br/>[I3] cleanup_ack_timeout_ms_illustrative = 10 000 ms. illustrative: design parameter; kernel cleanup acknowledgement deadline. Every settle bound must be strictly shorter</div></div></foreignObject><line x1="290" y1="202" x2="1230" y2="202" stroke="#333333" stroke-width="1"/><line x1="290" y1="202" x2="290" y2="207" stroke="#333333" stroke-width="1"/><line x1="478" y1="202" x2="478" y2="207" stroke="#333333" stroke-width="1"/><line x1="666" y1="202" x2="666" y2="207" stroke="#333333" stroke-width="1"/><line x1="854" y1="202" x2="854" y2="207" stroke="#333333" stroke-width="1"/><line x1="1042" y1="202" x2="1042" y2="207" stroke="#333333" stroke-width="1"/><line x1="1230" y1="202" x2="1230" y2="207" stroke="#333333" stroke-width="1"/><foreignObject x="620.0" y="267.0" width="40" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">yes</span></div></foreignObject><foreignObject x="605.0" y="385.0" width="110" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold;color:#b85450;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">no: the settle<br/>deadline passed</span></div></foreignObject><foreignObject x="1130.0" y="317.0" width="40" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">yes</span></div></foreignObject><foreignObject x="1130.0" y="427.0" width="40" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#b85450;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">no</span></div></foreignObject></svg>