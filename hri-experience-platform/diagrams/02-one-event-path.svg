<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="673" viewBox="0 0 1280 673"><rect x="0" y="0" width="1280" height="673" fill="#ffffff"/><defs><marker id="arrow_666666" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker><marker id="arrow_6c8ebf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#6c8ebf"/></marker><marker id="arrow_d79b00" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#d79b00"/></marker></defs><polyline points="180.0,97.0 215.0,97.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="180.0,129.0 215.0,129.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="180.0,161.0 215.0,161.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="180.0,193.0 215.0,193.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="180.0,225.0 215.0,225.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="180.0,257.0 215.0,257.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="515.0,174.0 545.0,174.0" fill="none" stroke="#d79b00" stroke-width="2.2" marker-end="url(#arrow_d79b00)"/><polyline points="885.0,174.0 915.0,174.0" fill="none" stroke="#d79b00" stroke-width="2.2" marker-end="url(#arrow_d79b00)"/><polyline points="1082.5,274.0 1082.0,297.0 125.0,297.0 125.0,320.0" fill="none" stroke="#d79b00" stroke-width="2.2" marker-end="url(#arrow_d79b00)"/><polyline points="220.0,362.0 236.0,362.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="426.0,362.0 442.0,362.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="632.0,362.0 648.0,362.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="838.0,362.0 854.0,362.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="1044.0,362.0 1060.0,362.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><rect x="20" y="12" width="1240" height="48" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:48px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">One event, one path: the kernel orders, admits and intercepts every input first; the reducer sees only what is left, and nothing is sent until one snapshot is committed</div></div></foreignObject><rect x="30" y="84" width="150" height="26" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="30" y="84" width="150" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">perception</div></div></foreignObject><rect x="30" y="116" width="150" height="26" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="30" y="116" width="150" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">reasoner turn results</div></div></foreignObject><rect x="30" y="148" width="150" height="26" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="30" y="148" width="150" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">motion-layer outcomes</div></div></foreignObject><rect x="30" y="180" width="150" height="26" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="30" y="180" width="150" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">timers</div></div></foreignObject><rect x="30" y="212" width="150" height="26" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="30" y="212" width="150" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">operator</div></div></foreignObject><rect x="30" y="244" width="150" height="26" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="30" y="244" width="150" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">simulation</div></div></foreignObject><rect x="30" y="64" width="150" height="18" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="30" y="64" width="150" height="18"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:18px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">INPUTS -&gt; typed events</div></div></foreignObject><rect x="215" y="74" width="300" height="200" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="215" y="74" width="300" height="200"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:200px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">1  ONE BOUNDED PRIORITY QUEUE, ONE WORKER<br/><br/>priority order:<br/>1 safety  &gt;  2 reset  &gt;  3 operator control  &gt;  4 correlated command outcomes  &gt;  5 observations<br/><br/>inside one priority, a total order from: normalised observation time -&gt; source rank -&gt; source sequence -&gt; event ID (Lamport 1978: a deterministic tie-break yields one order every replay agrees on)<br/><br/>replay uses the recorded accepted order</div></div></foreignObject><rect x="545" y="74" width="340" height="200" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="545" y="74" width="340" height="200"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:340px;height:200px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">2  ADMISSION  (checks the event context: source, sequence, times, clock domain, epoch, uncertainty, session, generation, command)<br/><br/>REJECTED, never reaching the reducer:<br/>- stale, duplicate, wrong generation, wrong session, wrong command<br/>- an outcome for a command that is not pending<br/>- age or timestamp uncertainty over its bound<br/>- a participant-bound input whose track is not the current participant track<br/>- a source not admitted for this target (B5: rejected before queue insertion)<br/><br/>rejected, NOT deferred: queueing would let one visitor&#x27;s content reach the next</div></div></foreignObject><rect x="915" y="74" width="335" height="200" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="915" y="74" width="335" height="200"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:335px;height:200px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">3  INTERCEPTION  (the kernel handles these itself)<br/><br/>safety and reset | readiness assessment, refresh, loss | start and yield of the idle &#x27;ready&#x27; behaviour | visitor-audio permit issue, revoke, refusal | runtime faults and queue overflow | operator abort | participant retirement needing cleanup | cleanup acknowledgements and the cleanup deadline | the startup proof that every store is clean<br/><br/>No experience may override, delay or reject any of them. The kernel then derives the TENTATIVE envelope.</div></div></foreignObject><rect x="30" y="320" width="190" height="84" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="30" y="320" width="190" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:84px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">4  REDUCER (the experience)<br/>pure: (local state, read-only envelope, event) -&gt; (next local state, ordered effects)</div></div></foreignObject><rect x="236" y="320" width="190" height="84" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="236" y="320" width="190" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:84px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">5  VALIDATE, in order:<br/>kernel invariants (cannot be waived) -&gt; story invariants -&gt; every effect</div></div></foreignObject><rect x="442" y="320" width="190" height="84" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="442" y="320" width="190" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:84px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">6  DERIVE COMMAND IDs<br/>deterministically, so a re-dispatch is idempotent</div></div></foreignObject><rect x="648" y="320" width="190" height="84" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="648" y="320" width="190" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:84px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">7  MATERIALISE commands and verify the tentative snapshot</div></div></foreignObject><rect x="854" y="320" width="190" height="84" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="3"/><foreignObject x="854" y="320" width="190" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:84px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">8  COMMIT ONE SNAPSHOT<br/>envelope + local state + pending commands + leases + timers</div></div></foreignObject><rect x="1060" y="320" width="190" height="84" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="1060" y="320" width="190" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:84px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">9  DISPATCH<br/>in effect order, through the catalog to the per-target adapters</div></div></foreignObject><rect x="30" y="418" width="808" height="44" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="30" y="418" width="808" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:808px;height:44px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Any failure in steps 4-7: NOTHING is committed and NOTHING is dispatched. A rejected event in step 2 never reaches the reducer, so no experience can act on it by mistake.</div></div></foreignObject><rect x="854" y="418" width="190" height="96" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="854" y="418" width="190" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:96px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Transactional outbox: state and intent are recorded together, then sent; a fast completion can never arrive before the state that records its command.</div></div></foreignObject><rect x="1060" y="418" width="190" height="96" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="1060" y="418" width="190" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:96px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">A dispatcher failure AFTER commit takes the correlated failure path; it never erases or invents command state.</div></div></foreignObject><rect x="30" y="470" width="808" height="44" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="30" y="470" width="808" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:808px;height:44px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Safety sorts first and is still typed and admitted. Preemption is proven from every local state of every registered experience (C2). Software preemption is additive: the guaranteed stop is a hardware relay in the emergency-stop loop (B4).</div></div></foreignObject><rect x="30" y="528" width="1220" height="40" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="528" width="1220" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend:  amber = kernel-owned steps  |  green = the one step the experience owns  |  blue = inputs and dispatch targets  |  red = what failure means  |  thick border = the commit point. One worker processes one event at a time: a public stand produces few events per second, so replayability, not throughput, is the constraint.</div></div></foreignObject><rect x="30" y="582" width="1220" height="75" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="582" width="1220" height="75"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:75px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Mechanisms: this kit&#x27;s notes/ (named per line below) and glossary.md. Every number is loaded from ../constants.json by the key shown: [Pn] = public (cited); [In] = illustrative (a round design parameter that keeps the design&#x27;s relations; never a measurement of any system); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/B4-kernel-interception-and-arbitration.md (intercepted classes, one ordered queue, priority and tie-break, admission rejections, rejection not deferral, single worker, hardware stop); B3-the-effect-vocabulary.md (atomic preparation and dispatch steps, transactional outbox, deterministic command IDs); B5 (target-scoped producer admission); C2 (preemption from every local state). Public: Lamport, &#x27;Time, clocks, and the ordering of events in a distributed system&#x27;, Communications 21(7), 1978; Richardson, &#x27;Pattern: Transactional outbox&#x27;, microservices.io. Step numbers on this page are a drawing order, not the numbering in the notes. This page carries no numeric design parameter.</div></div></foreignObject><foreignObject x="500.0" y="287.0" width="200" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#d79b00;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">delegate only what is left</span></div></foreignObject></svg>