<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="648" viewBox="0 0 1280 648"><rect x="0" y="0" width="1280" height="648" fill="#ffffff"/><defs><marker id="arrow_6c8ebf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#6c8ebf"/></marker><marker id="arrow_9673a6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#9673a6"/></marker><marker id="arrow_b85450" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b85450"/></marker></defs><line x1="88.5" y1="154.0" x2="89.0" y2="172.0" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow_9673a6)"/><line x1="225.0" y1="154.0" x2="225.0" y2="172.0" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow_9673a6)"/><line x1="361.5" y1="154.0" x2="361.0" y2="172.0" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow_9673a6)"/><line x1="89.0" y1="222.0" x2="88.5" y2="242.0" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow_9673a6)"/><line x1="225.0" y1="222.0" x2="225.0" y2="242.0" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow_9673a6)"/><line x1="361.0" y1="222.0" x2="361.5" y2="242.0" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow_9673a6)"/><line x1="225.0" y1="312.0" x2="225.0" y2="330.0" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow_9673a6)"/><line x1="640.0" y1="154.0" x2="640.0" y2="172.0" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><line x1="640.0" y1="222.0" x2="640.0" y2="242.0" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><line x1="420.0" y1="263.0" x2="445.0" y2="207.0" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_9673a6)"/><line x1="835.0" y1="277.0" x2="860.0" y2="311.9" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_6c8ebf)"/><rect x="20" y="12" width="1240" height="34" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><foreignObject x="20" y="12" width="1240" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">Room localisation by metric learning: learn &quot;same room vs different room&quot; once from many homes - then a new home needs one calibration walk, not a new model</div></div></foreignObject><rect x="30" y="58" width="390" height="30" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="30" y="58" width="390" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:390px;height:30px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">1  TRAIN once, on many homes [B5]</div></div></foreignObject><rect x="445" y="58" width="390" height="30" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="445" y="58" width="390" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:390px;height:30px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">2  CALIBRATE once per new home [B5]</div></div></foreignObject><rect x="860" y="58" width="390" height="30" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="860" y="58" width="390" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:390px;height:30px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">3  INFER: nearest reference embedding [B5]</div></div></foreignObject><rect x="30" y="100" width="390" height="54" rx="8" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/><foreignObject x="30" y="100" width="390" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:390px;height:54px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">CSI windows (subcarriers x time) from many homes, each labelled with the room the person was in (link labelling rule [B3])</div></div></foreignObject><rect x="30" y="172" width="118" height="50" rx="8" fill="#ffffff" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="30" y="172" width="118" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:118px;height:50px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">anchor<br/>room K, home H</div></div></foreignObject><rect x="166" y="172" width="118" height="50" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.5"/><foreignObject x="166" y="172" width="118" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:118px;height:50px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">positive<br/>same room K</div></div></foreignObject><rect x="302" y="172" width="118" height="50" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/><foreignObject x="302" y="172" width="118" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:118px;height:50px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">negative<br/>other room, SAME home</div></div></foreignObject><rect x="30" y="242" width="390" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="30" y="242" width="390" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:390px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ONE shared network (Siamese) embeds all three. Options: 1-D conv over time + weighting over subcarriers; 1-D conv over time then over subcarriers; or 2-D conv on the window as an image.</div></div></foreignObject><rect x="30" y="330" width="390" height="96" rx="8" fill="#ffffff" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="30" y="330" width="390" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:390px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Triplet loss: require  d(anchor, negative) &gt; d(anchor, positive) + margin.<br/>FaceNet uses a margin of 0.2 on unit-length embeddings [1] (public).<br/>Contrastive loss (pairs) is the alternative: pull same-room pairs together, push other-room pairs a margin apart.</div></div></foreignObject><rect x="445" y="100" width="390" height="54" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="445" y="100" width="390" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:390px;height:54px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">The user walks through each room once while the devices record CSI (the calibration walk)</div></div></foreignObject><rect x="445" y="172" width="390" height="50" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="445" y="172" width="390" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:390px;height:50px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">Embed those windows with the trained network (no retraining)</div></div></foreignObject><rect x="445" y="242" width="390" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="445" y="242" width="390" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:390px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">Store one or a few REFERENCE embeddings per room of THIS home. Any number of rooms, any layout.</div></div></foreignObject><rect x="445" y="330" width="390" height="96" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="445" y="330" width="390" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:390px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">References age: furniture, doors and device moves change the CSI, so the walk must be refreshed [B5, C5]. Metric learning removes labels in the deployed home - it does NOT remove the need for many training homes.</div></div></foreignObject><rect x="860" y="100" width="390" height="326" fill="#fbfbfb" stroke="#82b366" stroke-width="1"/><foreignObject x="860" y="100" width="390" height="326"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:390px;height:326px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Embedding space of one home (schematic, 2-D for drawing)</div></div></foreignObject><ellipse cx="950.0" cy="192.0" rx="60.0" ry="42.0" fill="#e8f0fa" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="6,4"/><foreignObject x="890" y="150" width="120" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:120px;height:84px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">kitchen</div></div></foreignObject><ellipse cx="1135.0" cy="185.0" rx="65.0" ry="45.0" fill="#ecf5e8" stroke="#82b366" stroke-width="1.5" stroke-dasharray="6,4"/><foreignObject x="1070" y="140" width="130" height="90"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:130px;height:90px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">living room</div></div></foreignObject><ellipse cx="1015.0" cy="332.0" rx="65.0" ry="42.0" fill="#f4ecf7" stroke="#9673a6" stroke-width="1.5" stroke-dasharray="6,4"/><foreignObject x="950" y="290" width="130" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:130px;height:84px;display:flex;align-items:flex-end;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">bedroom</div></div></foreignObject><rect x="942" y="186" width="14" height="14" fill="#6c8ebf" stroke="#6c8ebf" stroke-width="1"/><rect x="1128" y="176" width="14" height="14" fill="#82b366" stroke="#82b366" stroke-width="1"/><rect x="1008" y="318" width="14" height="14" fill="#9673a6" stroke="#9673a6" stroke-width="1"/><ellipse cx="1107.0" cy="253.0" rx="9.0" ry="9.0" fill="#b85450" stroke="#b85450" stroke-width="1.5"/><rect x="1056" y="262" width="184" height="36" fill="none" stroke="none" stroke-width="1"/><foreignObject x="1056" y="262" width="184" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:184px;height:36px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#b85450;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">live window -&gt; nearest<br/>reference = living room</div></div></foreignObject><ellipse cx="1199.0" cy="339.0" rx="9.0" ry="9.0" fill="#ffffff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="1096" y="350" width="150" height="50" fill="none" stroke="none" stroke-width="1"/><foreignObject x="1096" y="350" width="150" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:50px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#b85450;padding:6px;line-height:1.2;text-align:right;overflow:hidden;"><div style="width:100%;">farther than every reference<br/>-&gt; answer &quot;unknown&quot;: empty<br/>or the home has changed</div></div></foreignObject><rect x="30" y="444" width="600" height="66" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="30" y="444" width="600" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:66px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Why not a room classifier [B5]: a classifier has one output per class. A model trained on four-room homes has no meaning in a six-room home, and retraining per home needs a large labelled dataset. Metric learning turns per-home CLASSIFICATION (does not scale) into per-home CALIBRATION (one walk).</div></div></foreignObject><rect x="650" y="444" width="600" height="66" rx="8" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/><foreignObject x="650" y="444" width="600" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:66px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Two side uses [B5]: (1) single-device tests can still TRAIN on device-to-device links labelled by the room rule, adding data without changing what is available at test time; (2) devices whose CSI changes look alike are probably in the same room - auto-assign smart-home devices to rooms.</div></div></foreignObject><rect x="30" y="522" width="1220" height="44" fill="#f5f5f5" stroke="#999999" stroke-width="1"/><foreignObject x="30" y="522" width="1220" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:44px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend: purple = training (one network for all homes) | blue = per-home calibration | green = inference; dashed ellipses = rooms, squares = reference embeddings, red dot = live window, hollow red = unknown | amber = drift caveat | red panel = the reason for the design.  [B3], [B5], [C5] = kit notes.</div></div></foreignObject><rect x="30" y="578" width="1220" height="56" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><foreignObject x="30" y="578" width="1220" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:56px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Numbers (all loaded from constants.json):<br/>[1] triplet_margin_facenet - public; Schroff, Kalenichenko, Philbin, &#x27;FaceNet&#x27;, CVPR 2015, alpha<br/>Notes: [B5] room localisation by metric learning (no result numbers - a proposed method); [B3] link labelling; [C5] drift. Public refs: Hadsell, Chopra, LeCun, CVPR 2006 (contrastive); Schroff, Kalenichenko, Philbin, CVPR 2015 (FaceNet, triplet).</div></div></foreignObject><line x1="1107.0" y1="244.0" x2="1136.0" y2="192.0" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrow_b85450)"/></svg>