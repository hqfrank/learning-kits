<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840"><rect x="0" y="0" width="1280" height="840" fill="#ffffff"/><defs><marker id="arrow_666666" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker><marker id="arrow_b85450" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b85450"/></marker></defs><rect x="20" y="12" width="1240" height="34" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><foreignObject x="20" y="12" width="1240" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">CSI keeps the per-subcarrier fingerprint that RSSI averages away - and a moving body changes only the dynamic paths</div></div></foreignObject><rect x="30" y="62" width="620" height="440" fill="#fbfbfb" stroke="#999999" stroke-width="1"/><foreignObject x="30" y="62" width="620" height="440"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:620px;height:440px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">A room, seen from above (schematic, not to scale) [A1]</div></div></foreignObject><rect x="120" y="96" width="420" height="16" fill="#eeeeee" stroke="#666666" stroke-width="1"/><foreignObject x="120" y="96" width="420" height="16"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:420px;height:16px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">wall / furniture = STATIC reflector</div></div></foreignObject><rect x="50" y="250" width="120" height="62" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="50" y="250" width="120" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:120px;height:62px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">Transmitter (AP)<br/>sends known<br/>training symbols</div></div></foreignObject><rect x="500" y="250" width="130" height="62" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="500" y="250" width="130" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:130px;height:62px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">Receiver (device)<br/>estimates H per<br/>subcarrier</div></div></foreignObject><ellipse cx="328.0" cy="435.0" rx="28.0" ry="40.0" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="300" y="395" width="56" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:56px;height:80px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">person<br/>moves</div></div></foreignObject><rect x="250" y="258" width="150" height="20" fill="#fbfbfb" stroke="#fbfbfb" stroke-width="1"/><foreignObject x="250" y="258" width="150" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:20px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#333333;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">line of sight (static)</div></div></foreignObject><rect x="458" y="126" width="150" height="34" fill="#fbfbfb" stroke="#fbfbfb" stroke-width="1"/><foreignObject x="458" y="126" width="150" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#333333;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">reflected path<br/>(static)</div></div></foreignObject><rect x="420" y="440" width="150" height="48" fill="#fbfbfb" stroke="#fbfbfb" stroke-width="1"/><foreignObject x="420" y="440" width="150" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:48px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#b85450;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">reflected path<br/>(DYNAMIC: its length<br/>changes as she moves)</div></div></foreignObject><rect x="30" y="514" width="620" height="110" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="30" y="514" width="620" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:620px;height:110px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">The channel at subcarrier frequency f is the sum of all paths [A1; Ma et al. 2019]:<br/>      H(f) = Σᵢ aᵢ · exp(−j 2π f τᵢ)  =  H_static(f) + H_dynamic(f, t)<br/>Each path rotates by a different angle at each f, so paths add up differently per subcarrier (frequency-selective fading). Motion changes only H_dynamic: amplitude and phase fluctuate (CARM, Wang et al. 2015).</div></div></foreignObject><rect x="680" y="62" width="570" height="300" fill="#ffffff" stroke="#82b366" stroke-width="1"/><foreignObject x="680" y="62" width="570" height="300"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:570px;height:300px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">CSI: one complex value per subcarrier per antenna pair, every frame</div></div></foreignObject><rect x="690" y="300" width="550" height="58" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><foreignObject x="690" y="300" width="550" height="58"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:550px;height:58px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Bars = |H| per subcarrier (schematic shape, no data). Grey = frame before, red dashed = frame after the person moved: the fingerprint changes shape. Subcarriers 312.5 kHz apart [1]; 52 used at 20 MHz legacy [2], 56 in 802.11n HT20 [3]; a 2x2 link has 4 antenna pairs [4], each with its own row.</div></div></foreignObject><rect x="680" y="376" width="570" height="126" fill="#ffffff" stroke="#d79b00" stroke-width="1"/><foreignObject x="680" y="376" width="570" height="126"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:570px;height:126px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">RSSI: one power number per frame</div></div></foreignObject><rect x="700" y="410" width="160" height="40" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="700" y="410" width="160" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">frame before:<br/>one number</div></div></foreignObject><rect x="880" y="410" width="160" height="40" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" stroke-dasharray="6,4"/><foreignObject x="880" y="410" width="160" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">frame after:<br/>nearly the same</div></div></foreignObject><rect x="1050" y="400" width="195" height="98" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><foreignObject x="1050" y="400" width="195" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:195px;height:98px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Power summed over the whole channel. Two different motions can give the same RSSI change and different CSI changes [A1].</div></div></foreignObject><rect x="680" y="514" width="570" height="110" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="680" y="514" width="570" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:570px;height:110px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">How fast it fluctuates [A1]: one cycle per wavelength of path change; wavelength 12.3 cm at 2.4 GHz [5], 5.5 cm at 5 GHz [6]. A reflected path changes at up to 2x body speed, so a 1 m/s walk gives up to ~36 Hz at 5 GHz [7] (Doppler).<br/>CAUTION: beacon-driven CSI at an illustrative 10 Hz [8] cannot represent anything above 5 Hz (Nyquist, my arithmetic): you see aliased energy, not a clean Doppler spectrum.</div></div></foreignObject><rect x="30" y="636" width="1220" height="46" fill="#f5f5f5" stroke="#999999" stroke-width="1"/><foreignObject x="30" y="636" width="1220" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:46px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend:  blue = radios | red, red dashed = dynamic (motion-dependent) | grey = static | purple = model | green frame = CSI (PHY-layer detail) | amber = RSSI and timing caveat.<br/>[A1], [A2] = kit notes. [n] = constants.json entry listed below; ILLUSTRATIVE values are round teaching values, never measurements.</div></div></foreignObject><rect x="712" y="217" width="26" height="75" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="718" y="204" width="26" height="87" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="752" y="173" width="26" height="118" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="758" y="192" width="26" height="100" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="792" y="129" width="26" height="162" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="798" y="167" width="26" height="125" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="832" y="160" width="26" height="131" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="838" y="135" width="26" height="156" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="872" y="223" width="26" height="68" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="878" y="185" width="26" height="106" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="912" y="254" width="26" height="37" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="918" y="242" width="26" height="50" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="952" y="232" width="26" height="60" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="958" y="254" width="26" height="37" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="992" y="167" width="26" height="125" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="998" y="204" width="26" height="87" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="1032" y="104" width="26" height="187" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="1038" y="142" width="26" height="150" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="1072" y="92" width="26" height="200" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="1078" y="85" width="26" height="206" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="1112" y="148" width="26" height="143" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="1118" y="117" width="26" height="175" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="1152" y="202" width="26" height="90" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="1158" y="173" width="26" height="118" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="1192" y="242" width="26" height="50" fill="#cccccc" stroke="#999999" stroke-width="1"/><rect x="1198" y="223" width="26" height="68" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4"/><rect x="700" y="291" width="540" height="2" fill="#333333" stroke="#333333" stroke-width="1"/><rect x="30" y="694" width="1220" height="132" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><foreignObject x="30" y="694" width="1220" height="132"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:132px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Numbers (all loaded from constants.json):<br/>[1] ofdm_subcarrier_spacing_11a_n_ac - public; IEEE 802.11 OFDM PHY (clauses 17/19/21): 20 MHz / 64-point FFT<br/>[2] used_subcarriers_legacy_20MHz - public; IEEE 802.11a/g OFDM PHY<br/>[3] used_subcarriers_ht_20MHz - public; IEEE 802.11n HT20<br/>[4] mimo_2x2_streams - public; my arithmetic: 2 TX x 2 RX antennas<br/>[5] wavelength_2g4 - public; my arithmetic: speed_of_light / 2.437 GHz (channel 6)<br/>[6] wavelength_5g - public; my arithmetic: speed_of_light / 5.5 GHz (mid 5 GHz band)<br/>[7] doppler_walk_example_5g - public; my arithmetic: reflected path length changes at up to 2 x 1 m/s for an illustrative 1 m/s walk; f = 2 / wavelength_5g<br/>[8] csi_rate_beacon_illustrative - ILLUSTRATIVE; round value for passive beacon-driven CSI; consistent with beacon_rate_default; internal I2/I7 report the same order<br/>Notes: [A1] CSI and multipath (OFDM, CSI vs RSSI, static/dynamic paths, Doppler, Nyquist caution); [A2] what the hardware gives you. Public refs: IEEE 802.11 OFDM PHY; Ma, Zhou, Wang, CSUR 2019; Wang et al. MobiCom 2015 (CARM); Qian et al. 2017 (Widar/WiDance Doppler).</div></div></foreignObject><line x1="170.0" y1="281.0" x2="500.0" y2="281.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow_666666)"/><line x1="130.0" y1="250.0" x2="330.0" y2="112.0" stroke="#666666" stroke-width="1.5"/><line x1="330.0" y1="112.0" x2="545.0" y2="250.0" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow_666666)"/><line x1="150.0" y1="312.0" x2="300.0" y2="432.0" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/><line x1="356.0" y1="432.0" x2="520.0" y2="312.0" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow_b85450)"/></svg>