<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="768" viewBox="0 0 1280 768"><rect x="0" y="0" width="1280" height="768" fill="#ffffff"/><defs><marker id="arrow_444444" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#444444"/></marker></defs><rect x="20" y="12" width="1240" height="34" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><foreignObject x="20" y="12" width="1240" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">One link sees motion best near its two radios, less mid-link, and almost nothing a few metres off the line of sight or behind a wall</div></div></foreignObject><rect x="30" y="60" width="860" height="470" fill="#fbfbfb" stroke="#999999" stroke-width="1"/><foreignObject x="30" y="60" width="860" height="470"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:860px;height:470px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">One link, seen from above (schematic: zone widths exaggerated, not to scale) [A1]</div></div></foreignObject><rect x="60" y="110" width="800" height="330" rx="8" fill="#f3f7fc" stroke="#6c8ebf" stroke-width="1.5" stroke-dasharray="6,4"/><foreignObject x="60" y="110" width="800" height="330"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:800px;height:330px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#6c8ebf;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">walking visible out to about 4 m from the LoS [1] (illustrative); hand-waving about 3 m [2]</div></div></foreignObject><ellipse cx="445.0" cy="290.0" rx="370.0" ry="100.0" fill="none" stroke="#bbbbbb" stroke-width="1.5"/><ellipse cx="445.0" cy="290.0" rx="350.0" ry="68.0" fill="none" stroke="#999999" stroke-width="1.5"/><ellipse cx="445.0" cy="290.0" rx="330.0" ry="36.0" fill="#ece4f1" stroke="#9673a6" stroke-width="2"/><rect x="415" y="192" width="60" height="26" fill="none" stroke="none" stroke-width="1"/><foreignObject x="415" y="192" width="60" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:60px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#777777;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">zone 3</div></div></foreignObject><rect x="415" y="224" width="60" height="26" fill="none" stroke="none" stroke-width="1"/><foreignObject x="415" y="224" width="60" height="26"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:60px;height:26px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#555555;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">zone 2</div></div></foreignObject><rect x="385" y="256" width="120" height="22" fill="none" stroke="none" stroke-width="1"/><foreignObject x="385" y="256" width="120" height="22"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:120px;height:22px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#9673a6;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">first Fresnel zone</div></div></foreignObject><rect x="56" y="264" width="96" height="52" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="56" y="264" width="96" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:96px;height:52px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">AP<br/>(transmitter)</div></div></foreignObject><rect x="738" y="264" width="96" height="52" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="738" y="264" width="96" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:96px;height:52px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">device<br/>(receiver)</div></div></foreignObject><ellipse cx="185.0" cy="313.0" rx="17.0" ry="17.0" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="168" y="296" width="34" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:34px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">A</div></div></foreignObject><ellipse cx="445.0" cy="309.0" rx="17.0" ry="17.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="428" y="292" width="34" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:34px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">B</div></div></foreignObject><ellipse cx="617.0" cy="407.0" rx="17.0" ry="17.0" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/><foreignObject x="600" y="390" width="34" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:34px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">C</div></div></foreignObject><rect x="60" y="452" width="800" height="14" fill="#bbbbbb" stroke="#666666" stroke-width="1"/><foreignObject x="60" y="452" width="800" height="14"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:800px;height:14px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">wall</div></div></foreignObject><ellipse cx="447.0" cy="495.0" rx="17.0" ry="17.0" fill="#ffffff" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4"/><foreignObject x="430" y="478" width="34" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:34px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">D</div></div></foreignObject><rect x="470" y="476" width="380" height="40" fill="none" stroke="none" stroke-width="1"/><foreignObject x="470" y="476" width="380" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:380px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">D: next room, behind the wall - most of the effect removed [A1]; but what remains is a through-wall false positive [B4]</div></div></foreignObject><rect x="910" y="60" width="340" height="250" rx="8" fill="#eeeeee" stroke="#666666" stroke-width="1.5"/><foreignObject x="910" y="60" width="340" height="250"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:340px;height:250px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">What one link sees - a power-fading simulation and single-link measurements agreed [A1]:<br/><br/>A  motion close to EITHER radio changes the CSI most (red).<br/><br/>B  on the LoS, motion mid-link changes it LESS than near the ends: the first zone is narrowest at the radios, so a body there fills more of it (amber).<br/><br/>C  sensitivity falls steeply outside the first zone (grey).<br/><br/>Also: motion ON the LoS drops power more than motion beside it.</div></div></foreignObject><rect x="910" y="322" width="340" height="208" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="910" y="322" width="340" height="208"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:340px;height:208px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Fresnel zones (Wang et al. UbiComp 2016): nested ellipses with the radios at the foci; zone n ends where a reflected path is n half-wavelengths longer than the LoS. First-zone radius at mid-link:<br/>      r1 = 0.5 x sqrt(lambda x d)<br/>For an illustrative d = 4 m link [3]:<br/>   0.23 m at 5 GHz, 0.35 m at 2.4 GHz [4]<br/>A body crossing zone boundaries makes one fluctuation per boundary.</div></div></foreignObject><rect x="30" y="542" width="1220" height="52" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="30" y="542" width="1220" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:52px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">So what: placement decides coverage. A room with no device is covered only weakly, through walls, and one link cannot tell motion near its AP end from motion near its device end - only a comparison across several links resolves that [B4, C5].</div></div></foreignObject><rect x="30" y="604" width="1220" height="44" fill="#f5f5f5" stroke="#999999" stroke-width="1"/><foreignObject x="30" y="604" width="1220" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:44px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend: blue = radios | purple fill = first Fresnel zone, grey rings = zones 2-3 | dashed blue = illustrative detectable band | target fill: red = large change, amber = smaller, grey = weak, dashed white = behind a wall.  [A1], [B4], [C5] = kit notes; [n] = constants.json entries below.</div></div></foreignObject><rect x="30" y="658" width="1220" height="96" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/><foreignObject x="30" y="658" width="1220" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:96px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:9px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Numbers (all loaded from constants.json):<br/>[1] single_link_range_illustrative - ILLUSTRATIVE; illustrative distance beyond which walking motion is hard to see on one link; internal I1 reports the same order<br/>[2] small_motion_range_illustrative - ILLUSTRATIVE; illustrative range for hand-waving detection; internal I1<br/>[3] link_length_illustrative - ILLUSTRATIVE; round room-scale link length used for the Fresnel example in A1<br/>[4] fresnel_first_zone_mid_radius_example - public; my arithmetic: r1 = 0.5 x sqrt(lambda x d) at the midpoint of a link of illustrative length d = 4 m (link_length_illustrative); formula from Fresnel-zone model, Wang et al. UbiComp 2016<br/>Notes: [A1] CSI and multipath (Fresnel zones, single-link patterns, range, wall); [B4] multi-device joint detection; [C5] limits. Public ref: Wang et al., UbiComp 2016 (Fresnel-zone model).</div></div></foreignObject><line x1="152.0" y1="290.0" x2="738.0" y2="290.0" stroke="#444444" stroke-width="2" marker-end="url(#arrow_444444)"/></svg>