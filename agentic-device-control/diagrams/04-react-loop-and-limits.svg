<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880"><rect x="0" y="0" width="1280" height="880" fill="#ffffff"/><defs><marker id="arrow_666666" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker><marker id="arrow_82b366" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#82b366"/></marker><marker id="arrow_d79b00" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#d79b00"/></marker></defs><polyline points="190.0,196.0 189.9,226.0" fill="none" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow_82b366)"/><polyline points="320.0,348.0 410.0,348.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="515.0,396.0 515.0,444.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="410.0,492.0 215.0,492.0 215.0,396.0" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#arrow_666666)"/><polyline points="215.0,300.0 215.0,274.0 650.0,274.0 650.0,274.0" fill="none" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow_82b366)"/><polyline points="620.0,492.0 650.0,492.0" fill="none" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><polyline points="789.5,262.0 790.0,168.0 300.0,168.0" fill="none" stroke="#82b366" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_82b366)"/><rect x="20" y="12" width="1240" height="34" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">Three nested limits bound one task: 20 [I1] ReAct iterations per specialist turn, inside 10 [I2] graph hops, inside a 5 min [I3] watchdog</div></div></foreignObject><rect x="30" y="64" width="820" height="580" rx="8" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/><foreignObject x="30" y="64" width="820" height="580"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:820px;height:580px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">WATCHDOG: whole task, 5 min [I3] wall clock  -&gt;  catches a slow model or network</div></div></foreignObject><rect x="50" y="100" width="780" height="528" rx="8" fill="none" stroke="#d79b00" stroke-width="2" stroke-dasharray="6,4"/><foreignObject x="50" y="100" width="780" height="528"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:780px;height:528px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">GRAPH STEP LIMIT: 10 [I2] orchestrator -&gt; specialist hops  -&gt;  catches ping-pong between nodes</div></div></foreignObject><rect x="80" y="140" width="220" height="56" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="80" y="140" width="220" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:220px;height:56px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ORCHESTRATOR<br/>routes to a specialist (diagram 02)</div></div></foreignObject><rect x="70" y="226" width="740" height="386" rx="8" fill="none" stroke="#82b366" stroke-width="2" stroke-dasharray="6,4"/><foreignObject x="70" y="226" width="740" height="386"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:740px;height:386px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ONE SPECIALIST TURN: ReAct iteration limit 20 [I1]  -&gt;  catches a stuck inner loop</div></div></foreignObject><rect x="110" y="300" width="210" height="96" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="110" y="300" width="210" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:210px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">THOUGHT<br/>the model reasons about the<br/>latest screenshot + history</div></div></foreignObject><rect x="410" y="300" width="210" height="96" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="410" y="300" width="210" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:210px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ACTION<br/>a tool call, e.g. left_click;<br/>device code executes it</div></div></foreignObject><rect x="410" y="444" width="210" height="96" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="410" y="444" width="210" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:210px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">OBSERVATION<br/>wait the settle delay 1 s [I4],<br/>capture, return the screenshot<br/>as the tool result</div></div></foreignObject><rect x="100" y="544" width="300" height="56" rx="8" fill="#fff7f7" stroke="#b85450" stroke-width="1.5"/><foreignObject x="100" y="544" width="300" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:300px;height:56px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Action failed on the device? Return an ERROR RESULT as the observation; the model reads it and re-plans. An exception would end the loop instead.</div></div></foreignObject><rect x="650" y="262" width="150" height="92" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1.5"/><foreignObject x="650" y="262" width="150" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:92px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">EXIT 1<br/>reply with NO tool call:<br/>sub-goal believed done<br/>(orchestrator still checks)</div></div></foreignObject><rect x="650" y="444" width="150" height="96" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="650" y="444" width="150" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">EXIT 2  loop detection<br/>same action repeated,<br/>screen unchanged:<br/>stop, report &quot;stuck&quot;</div></div></foreignObject><rect x="870" y="64" width="380" height="150" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="870" y="64" width="380" height="150"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:380px;height:150px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHAT EACH LIMIT CATCHES<br/>- iteration limit 20 [I1]: a stuck inner loop<br/>- graph step limit 10 [I2]: ping-pong between nodes<br/>- watchdog 5 min [I3]: a slow model or network (a slow step can use up time without using up steps)<br/>Size each from the step-count distribution of SUCCESSFUL runs, plus headroom. Too low fails healthy long tasks; too high lets a stuck loop burn tokens.</div></div></foreignObject><rect x="870" y="228" width="380" height="124" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="870" y="228" width="380" height="124"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:380px;height:124px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHY THE LOOP MATTERS: RECOVERY<br/>Without recovery, per-step reliability compounds: p = 0.9 [I5] per step, n = 5 [I6] steps, so the task succeeds with p^n = 0.9^5 ≈ 0.59 [calc].<br/>The observe-and-retry loop breaks this product: a wrong click shows in the next observation and is undone (go_back, close a dialog, scroll).</div></div></foreignObject><rect x="870" y="366" width="380" height="108" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="870" y="366" width="380" height="108"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:380px;height:108px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">PUBLIC EVIDENCE FOR THE PATTERN<br/>ReAct (Yao et al. 2022): +34 pp [P7] absolute success on ALFWorld and +10 pp [P8] on WebShop over imitation / RL baselines, with only 1-2 [P9] in-context examples.<br/>Their benchmarks, not yours: measure on your own devices and apps.</div></div></foreignObject><rect x="30" y="658" width="1220" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="658" width="1220" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:36px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend:  dashed frames = limits, each wraps everything inside it (red watchdog, amber step limit, green iteration limit)  |  green = model call  |  blue = device code  |  amber = check in code  |  red = error result  |  solid arrows = one ReAct iteration; exits leave the turn and return to the orchestrator</div></div></foreignObject><rect x="30" y="708" width="1220" height="156" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="708" width="1220" height="156"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:156px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Numbers are loaded from ../constants.json by key (shown). P = public (cited doc/paper, value as published); I = illustrative (round value chosen to explain the idea, never a measurement); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/06-the-react-loop.md (loop, two loop exits, three nested limits, error results, loop detection, limit sizing); notes/09-evaluation.md (compounding per-step reliability). Vendor reference loop and error handling: computer-use tool documentation, &#x27;Understand the agent loop&#x27;, &#x27;Handle errors&#x27;. ReAct: Yao et al. 2022, https://arxiv.org/abs/2210.03629, abstract.<br/>[I1] react_iteration_limit_illustrative = 20 iterations per specialist turn. illustrative inner-loop limit<br/>[I2] graph_step_limit_illustrative = 10 orchestrator hops. illustrative outer-loop limit<br/>[I3] watchdog_timeout_illustrative = 5 min. illustrative hard limit on task wall time<br/>[I4] settle_delay_illustrative = 1 s. illustrative wait after an action before the next screenshot<br/>[I5] per_step_success_illustrative = 0.9 probability. illustrative; with 5 steps and no recovery gives 0.59 by my arithmetic<br/>[I6] steps_without_recovery_illustrative = 5 steps. illustrative<br/>[P7] react_alfworld_gain_pp = 34 percentage points absolute success rate. public: Yao et al. 2022, ReAct, arXiv:2210.03629, abstract (ALFWorld, over imitation/RL baselines)<br/>[P8] react_webshop_gain_pp = 10 percentage points absolute success rate. public: Yao et al. 2022, ReAct, arXiv:2210.03629, abstract (WebShop)<br/>[P9] react_in_context_examples = [1, 2] examples. public: Yao et al. 2022, ReAct, arXiv:2210.03629, abstract</div></div></foreignObject><foreignObject x="197.0" y="202.0" width="50" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">route</span></div></foreignObject><foreignObject x="285.0" y="338.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#666666;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">tool call</span></div></foreignObject><foreignObject x="480.0" y="410.0" width="70" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#666666;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">executed</span></div></foreignObject><foreignObject x="262.0" y="482.0" width="100" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#666666;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">next iteration</span></div></foreignObject><foreignObject x="425.0" y="264.0" width="90" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">no tool call</span></div></foreignObject><foreignObject x="395.0" y="158.0" width="230" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">summary to state; control returns</span></div></foreignObject></svg>