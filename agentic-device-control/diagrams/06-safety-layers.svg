<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="756" viewBox="0 0 1280 756"><rect x="0" y="0" width="1280" height="756" fill="#ffffff"/><defs><marker id="arrow_82b366" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#82b366"/></marker><marker id="arrow_9673a6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#9673a6"/></marker><marker id="arrow_999999" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#999999"/></marker><marker id="arrow_b85450" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b85450"/></marker><marker id="arrow_d79b00" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#d79b00"/></marker></defs><polyline points="260.0,130.0 280.0,130.0 280.0,155.0 300.0,155.2" fill="none" stroke="#9673a6" stroke-width="2.2" marker-end="url(#arrow_9673a6)"/><polyline points="260.0,276.0 280.0,276.0 280.0,261.0 300.0,260.8" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow_b85450)"/><polyline points="530.0,190.4 590.0,176.0" fill="none" stroke="#82b366" stroke-width="2.2" marker-end="url(#arrow_82b366)"/><polyline points="790.0,192.0 810.0,192.0" fill="none" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><polyline points="1010.0,192.0 1030.0,192.0" fill="none" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><polyline points="690.0,272.0 689.9,318.0" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow_b85450)"/><polyline points="910.0,272.0 910.0,318.0" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow_b85450)"/><polyline points="1060.0,272.0 1060.0,296.0 1000.0,296.0 1000.0,349.0 970.0,349.0" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow_b85450)"/><polyline points="1170.0,272.0 1170.0,318.0" fill="none" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow_82b366)"/><polyline points="590.0,349.0 415.0,349.0 415.0,296.0" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow_b85450)"/><polyline points="369.0,296.0 369.2,430.0" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_999999)"/><polyline points="780.0,380.0 780.3,430.0" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_999999)"/><polyline points="1130.0,380.0 1130.4,430.0" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_999999)"/><rect x="20" y="12" width="1240" height="34" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">The model proposes, device code disposes: each layer after the prompt assumes the one before it has failed, and the log records every step</div></div></foreignObject><rect x="30" y="84" width="230" height="92" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="30" y="84" width="230" height="92"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:230px;height:92px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">TASK  (trusted)<br/>from the authenticated cloud<br/>message: the ONLY instruction</div></div></foreignObject><rect x="30" y="206" width="230" height="140" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="30" y="206" width="230" height="140"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:230px;height:140px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">SCREEN CONTENT  (untrusted DATA)<br/>notifications, web pages,<br/>in-app messages, text inside images<br/>-&gt; indirect prompt injection<br/>(OWASP LLM01)</div></div></foreignObject><rect x="300" y="120" width="230" height="176" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="300" y="120" width="230" height="176"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:230px;height:176px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">THE MODEL PROPOSES<br/>(orchestrator / specialists)<br/><br/>LAYER 1  INSTRUCTION HIERARCHY<br/>in the system prompt: only the task is an instruction; screen text is content to read.<br/>Lowers the injection rate. Does NOT remove it.</div></div></foreignObject><rect x="570" y="70" width="680" height="330" rx="8" fill="none" stroke="#6c8ebf" stroke-width="2" stroke-dasharray="6,4"/><foreignObject x="570" y="70" width="680" height="330"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:680px;height:330px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">DEVICE CODE DISPOSES  (the model cannot change anything in this frame)</div></div></foreignObject><rect x="590" y="112" width="200" height="160" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="590" y="112" width="200" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:160px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">LAYER 2  ALLOW-LIST<br/>named, typed tools only; no &quot;run this command&quot; tool.<br/>Arguments checked: launch_app accepts listed packages, open_settings listed pages.</div></div></foreignObject><rect x="810" y="112" width="200" height="160" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="810" y="112" width="200" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:160px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">LAYER 3  SCOPE LIMITS<br/>screen taps cannot be listed one by one, so limit the context: only apps on the per-task list; refuse to type into password, payment or account-deletion screens.</div></div></foreignObject><rect x="1030" y="112" width="200" height="160" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="1030" y="112" width="200" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:160px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">LAYER 4  CONFIRMATION GATE<br/>irreversible or costly (purchase, delete, send a message, factory reset): approval from a human or a cloud policy, before EACH action in a batch.</div></div></foreignObject><rect x="590" y="318" width="380" height="62" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="590" y="318" width="380" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:380px;height:62px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">REFUSED  -&gt;  error result to the model, and logged</div></div></foreignObject><rect x="1030" y="318" width="200" height="62" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="1030" y="318" width="200" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:200px;height:62px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">EXECUTE on the device</div></div></foreignObject><rect x="30" y="430" width="1220" height="54" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="430" width="1220" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:54px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">LAYER 5  AUDIT LOG  (append-only, stored off the device with the result report, diagram 01):  the task  |  every routing decision  |  every tool call with its arguments  |  every result  |  a reference to each screenshot</div></div></foreignObject><rect x="30" y="504" width="610" height="112" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="504" width="610" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:610px;height:112px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">TRADE-OFFS<br/>- Least privilege vs capability: every tool removed shrinks the blast radius and removes something a task might need. Start narrow; add a tool when an evaluated task needs it.<br/>- Privileged installation is a target: authenticate cloud messages, use short-lived credentials, keep one task source.<br/>- Screenshots hold personal data (OWASP LLM02): minimise retention, redact, access-control the logs.<br/>- Gates cost latency and autonomy: gate the irreversible few, not every tap.</div></div></foreignObject><rect x="655" y="504" width="595" height="112" rx="8" fill="#fff7f7" stroke="#b85450" stroke-width="1.5"/><foreignObject x="655" y="504" width="595" height="112"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:595px;height:112px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">OWASP TOP 10 FOR LLM APPLICATIONS 2025 -&gt; WHICH LAYER ANSWERS IT<br/>- LLM01 Prompt Injection (the screen is the channel): layer 1 lowers it; layers 2-4 bound the damage when it succeeds.<br/>- LLM06 Excessive Agency (more tools, permissions or autonomy than the job needs): layers 2, 3, 4.<br/>- LLM02 Sensitive Information Disclosure: retention, redaction and access control on screenshots and logs (layer 5).<br/>A gate the model can approve for itself is not a gate.</div></div></foreignObject><rect x="30" y="630" width="1220" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="630" width="1220" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:36px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend:  purple = trusted input  |  red = untrusted input, refusal  |  green = model / execution  |  amber = a check in device code  |  dashed blue frame = code the model cannot alter  |  dashed grey arrows = written to the audit log</div></div></foreignObject><rect x="30" y="680" width="1220" height="60" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="680" width="1220" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:60px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Numbers are loaded from ../constants.json by key (shown). P = public (cited doc/paper, value as published); I = illustrative (round value chosen to explain the idea, never a measurement); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/08-safety.md (two dominant risks, five controls, trade-offs). Public: OWASP Top 10 for LLM Applications 2025, https://genai.owasp.org/llm-top-10/ (LLM01, LLM02, LLM06); computer-use tool documentation, &#x27;Limitations&#x27; (prompt injection via web pages or images) and &#x27;Batch actions&#x27; (confirm before each action in a batch).<br/>This page carries no numbers from ../constants.json: note 08 states none. OWASP identifiers are public labels, not quantities.</div></div></foreignObject><foreignObject x="242.0" y="104.0" width="80" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#9673a6;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">instruction</span></div></foreignObject><foreignObject x="237.0" y="284.0" width="90" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#b85450;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">read as data</span></div></foreignObject><foreignObject x="530.0" y="132.0" width="40" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">tool<br/>call</span></div></foreignObject><foreignObject x="720.0" y="182.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#d79b00;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">ok</span></div></foreignObject><foreignObject x="940.0" y="182.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#d79b00;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">ok</span></div></foreignObject><foreignObject x="610.0" y="285.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#b85450;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">fails</span></div></foreignObject><foreignObject x="830.0" y="285.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#b85450;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">fails</span></div></foreignObject><foreignObject x="1005.0" y="278.0" width="50" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#b85450;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">denied</span></div></foreignObject><foreignObject x="1140.0" y="285.0" width="60" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">approved</span></div></foreignObject><foreignObject x="420.0" y="352.0" width="120" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#b85450;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">error result: re-plan</span></div></foreignObject></svg>