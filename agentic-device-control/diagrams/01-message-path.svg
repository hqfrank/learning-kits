<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="786" viewBox="0 0 1280 786"><rect x="0" y="0" width="1280" height="786" fill="#ffffff"/><defs><marker id="arrow_6c8ebf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#6c8ebf"/></marker><marker id="arrow_82b366" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#82b366"/></marker><marker id="arrow_9673a6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#9673a6"/></marker><marker id="arrow_999999" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#999999"/></marker><marker id="arrow_b85450" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b85450"/></marker><marker id="arrow_d79b00" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#d79b00"/></marker></defs><polyline points="210.0,165.0 270.0,165.0" fill="none" stroke="#9673a6" stroke-width="1.5" marker-end="url(#arrow_9673a6)"/><polyline points="420.0,165.0 450.0,165.0" fill="none" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><polyline points="615.0,165.0 645.0,165.0" fill="none" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><polyline points="800.0,165.0 840.0,168.0" fill="none" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><polyline points="1000.0,168.0 1025.0,168.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="345.0,220.0 345.0,300.0" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow_b85450)"/><polyline points="532.5,220.0 532.5,300.0" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_999999)"/><polyline points="722.5,220.0 722.5,300.0" fill="none" stroke="#d79b00" stroke-width="1.5" marker-end="url(#arrow_d79b00)"/><polyline points="920.0,240.0 920.0,300.0" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow_b85450)"/><polyline points="1132.5,220.0 1132.5,300.0" fill="none" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow_82b366)"/><polyline points="345.0,370.0 344.7,430.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="722.5,370.0 724.0,430.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="920.0,370.0 919.9,430.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="1132.5,370.0 1132.3,430.0" fill="none" stroke="#6c8ebf" stroke-width="1.5" marker-end="url(#arrow_6c8ebf)"/><polyline points="270.0,458.0 120.0,458.0 120.0,220.0" fill="none" stroke="#9673a6" stroke-width="2.2" marker-end="url(#arrow_9673a6)"/><rect x="20" y="12" width="1240" height="34" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">Four cheap guards run before any model token is spent, and every accepted task ends as exactly one result</div></div></foreignObject><rect x="30" y="110" width="180" height="110" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><foreignObject x="30" y="110" width="180" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:180px;height:110px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">CLOUD SERVER<br/>sends one task message:<br/>message ID, session ID,<br/>type, payload = task text</div></div></foreignObject><rect x="270" y="110" width="150" height="110" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="270" y="110" width="150" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:110px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">1  VALIDATE<br/>well-formed?<br/>known message type?</div></div></foreignObject><rect x="450" y="110" width="165" height="110" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="450" y="110" width="165" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:165px;height:110px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">2  DE-DUPLICATE<br/>seen this message ID<br/>recently?<br/>IDs kept 10 min [I1]</div></div></foreignObject><rect x="645" y="110" width="155" height="110" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="645" y="110" width="155" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:155px;height:110px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">3  LOCK<br/>is another task<br/>running?<br/>one screen = one task</div></div></foreignObject><rect x="825" y="66" width="430" height="174" rx="8" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/><foreignObject x="825" y="66" width="430" height="174"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:430px;height:174px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">4  WATCHDOG: hard stop after 5 min [I2]</div></div></foreignObject><rect x="840" y="116" width="160" height="104" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="840" y="116" width="160" height="104"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:104px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">WORK EXECUTOR<br/>background job,<br/>outside the UI<br/>(e.g. WorkManager)</div></div></foreignObject><rect x="1025" y="116" width="215" height="104" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="1025" y="116" width="215" height="104"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:215px;height:104px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">AGENT GRAPH<br/>orchestrator + two<br/>specialists call the model<br/>(diagram 02)</div></div></foreignObject><rect x="270" y="300" width="150" height="70" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="270" y="300" width="150" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:150px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ERROR at once<br/>malformed or<br/>unknown type</div></div></foreignObject><rect x="450" y="300" width="165" height="70" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5" stroke-dasharray="6,4"/><foreignObject x="450" y="300" width="165" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:165px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">DROPPED<br/>not a new task:<br/>no second run,<br/>no second result</div></div></foreignObject><rect x="645" y="300" width="155" height="70" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="645" y="300" width="155" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:155px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">BUSY at once<br/>no queue: the cloud<br/>decides on retry</div></div></foreignObject><rect x="840" y="300" width="160" height="70" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="840" y="300" width="160" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">TIMEOUT<br/>stop, clean up,<br/>release the lock</div></div></foreignObject><rect x="1025" y="300" width="215" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="1025" y="300" width="215" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:215px;height:70px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">SUCCESS or ERROR<br/>FINISH reached, or a model<br/>error / exception is caught</div></div></foreignObject><rect x="270" y="430" width="970" height="56" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="270" y="430" width="970" height="56"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:970px;height:56px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ONE RESULT MESSAGE up the channel, exactly once per accepted task:  status (SUCCESS | ERROR | BUSY | TIMEOUT)  +  execution time  +  task description</div></div></foreignObject><rect x="30" y="520" width="600" height="98" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="520" width="600" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:600px;height:98px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHY THESE GUARDS (design choices)<br/>- BUSY instead of a queue: a queued task would run minutes later on a changed screen. BUSY hands the retry decision to the cloud, which knows whether the task is still wanted. Cost: the cloud must retry with back-off.<br/>- The timeout is a safety bound, not a performance number. Size it well above the slow tail of successful tasks, e.g. several x the 20 s [I3] simple task.<br/>- One result per accepted task: a missing result looks like a lost message, so the cloud cannot decide whether to retry.</div></div></foreignObject><rect x="650" y="520" width="590" height="98" rx="8" fill="#fff7f7" stroke="#b85450" stroke-width="1.5"/><foreignObject x="650" y="520" width="590" height="98"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:590px;height:98px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">THE IDEMPOTENCY TRAP<br/>De-duplication makes an exact repeat of one message safe. It does NOT make the task idempotent: &quot;add an item to the list&quot; run twice adds two items.<br/>A retry with a NEW message ID runs the task again. So after a lost result the cloud must ask the device first, or send only tasks that are safe to repeat.</div></div></foreignObject><rect x="30" y="632" width="1210" height="40" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="632" width="1210" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1210px;height:40px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend:  purple = cloud side  |  amber = guard in device code  |  blue = device component  |  green = agent that calls the model  |  red = failure status or time limit (dashed frame = the limit wraps everything inside it)  |  dashed grey = dropped, no result sent.  Cloud message channel: down = task, up = result.</div></div></foreignObject><rect x="30" y="686" width="1210" height="84" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="686" width="1210" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1210px;height:84px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Numbers are loaded from ../constants.json by key (shown). P = public (cited doc/paper, value as published); I = illustrative (round value chosen to explain the idea, never a measurement); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/01-the-message-path.md (five stages, four guards, the four result statuses, idempotency, design choices). Work executor example: Android WorkManager guide, https://developer.android.com/topic/libraries/architecture/workmanager (public). No measured numbers.<br/>[I1] dedup_window_illustrative = 10 min. illustrative retention of message IDs in the de-duplication cache<br/>[I2] watchdog_timeout_illustrative = 5 min. illustrative hard limit on task wall time<br/>[I3] task_wall_time_illustrative = 20 s. illustrative end-to-end time for a simple &#x27;open an app&#x27; task; sum of the 07 budget table</div></div></foreignObject><foreignObject x="220.0" y="143.0" width="40" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#9673a6;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">down</span></div></foreignObject><foreignObject x="355.0" y="155.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#d79b00;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">ok</span></div></foreignObject><foreignObject x="550.0" y="155.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#d79b00;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">new</span></div></foreignObject><foreignObject x="792.0" y="146.0" width="40" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#d79b00;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">free</span></div></foreignObject><foreignObject x="265.0" y="250.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#b85450;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">no</span></div></foreignObject><foreignObject x="452.5" y="250.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#999999;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">repeat</span></div></foreignObject><foreignObject x="642.5" y="250.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#d79b00;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">held</span></div></foreignObject><foreignObject x="840.0" y="260.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#b85450;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">limit passed</span></div></foreignObject><foreignObject x="1052.0" y="260.0" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">graph ends</span></div></foreignObject><foreignObject x="135.0" y="460.0" width="30" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#9673a6;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">up</span></div></foreignObject></svg>