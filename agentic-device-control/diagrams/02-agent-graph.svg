<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="938" viewBox="0 0 1280 938"><rect x="0" y="0" width="1280" height="938" fill="#ffffff"/><defs><marker id="arrow_666666" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker><marker id="arrow_82b366" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#82b366"/></marker><marker id="arrow_b85450" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#b85450"/></marker></defs><polyline points="120.0,285.0 150.0,285.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow_666666)"/><polyline points="440.0,285.0 530.0,285.0" fill="none" stroke="#82b366" stroke-width="2.2" marker-end="url(#arrow_82b366)"/><polyline points="615.0,245.0 615.0,150.0 780.0,150.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow_666666)"/><polyline points="700.0,285.0 780.0,285.0" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow_b85450)"/><polyline points="615.0,325.0 615.0,420.0 780.0,420.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow_666666)"/><polyline points="900.0,285.0 950.0,285.0" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrow_b85450)"/><polyline points="950.0,80.0 950.0,62.0 295.0,62.0 295.0,200.0" fill="none" stroke="#82b366" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_82b366)"/><polyline points="950.0,490.0 950.0,525.0 295.0,525.0 295.0,370.0" fill="none" stroke="#82b366" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_82b366)"/><rect x="20" y="12" width="1240" height="34" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">One planner, two doers and a plain-code router: every specialist turn returns to the orchestrator until it says FINISH</div></div></foreignObject><rect x="30" y="263" width="90" height="44" rx="22" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="263" width="90" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:90px;height:44px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">START</div></div></foreignObject><rect x="150" y="200" width="290" height="170" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="150" y="200" width="290" height="170"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:290px;height:170px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ORCHESTRATOR  (planner)<br/>stronger, slower model tier<br/>temperature 0.2 [I1]<br/>max output 4 000 tokens [I3]<br/><br/>plans ONE step, picks the next node,<br/>FINISHes only on visible evidence</div></div></foreignObject><rect x="530" y="245" width="170" height="80" rx="8" fill="#ffffff" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4"/><foreignObject x="530" y="245" width="170" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:170px;height:80px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ROUTER<br/>plain code, not a model:<br/>switch on one field</div></div></foreignObject><rect x="780" y="80" width="340" height="140" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="780" y="80" width="340" height="140"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:340px;height:140px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">VISION SPECIALIST<br/>fast tier | temperature 0 [I2] | max output 4 000 [I3]<br/>tools: the computer-use tool (screenshot, left_click,<br/>type, key, scroll, zoom ...)<br/>acts through the screen (diagram 03),<br/>in its own ReAct loop (diagram 04)</div></div></foreignObject><rect x="780" y="262" width="120" height="46" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><foreignObject x="780" y="262" width="120" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:120px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">FINISH</div></div></foreignObject><rect x="950" y="262" width="80" height="46" rx="22" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="950" y="262" width="80" height="46"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:80px;height:46px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">END</div></div></foreignObject><rect x="1040" y="256" width="220" height="60" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="1040" y="256" width="220" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:220px;height:60px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">then the one result report<br/>(diagram 01)</div></div></foreignObject><rect x="780" y="350" width="340" height="140" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="780" y="350" width="340" height="140"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:340px;height:140px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">ACTUATOR<br/>fast tier | temperature 0 [I2] | max output 2 000 [I3]<br/>tools: launch_app, open_settings, go_home, go_back,<br/>set_volume, get_device_state  (each allow-listed)<br/>OS route to open an app: 1 call, about 2 s,<br/>vs 2 calls, about 10 s through the screen [I4]</div></div></foreignObject><rect x="30" y="556" width="1220" height="50" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="30" y="556" width="1220" height="50"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:50px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">STATE  (one shared object rides every edge):  task text  |  routing decisions + each specialist&#x27;s summary  |  latest screenshot  |  step counter.  Step limit: 10 orchestrator hops [I5] stops a graph that never says FINISH. It counts steps; the watchdog (diagram 01) counts seconds; keep both.</div></div></foreignObject><rect x="30" y="622" width="610" height="128" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="622" width="610" height="128"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:610px;height:128px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHY A HAND-WRITTEN GRAPH, NOT A PYTHON FRAMEWORK<br/>The device runtime is Java/Kotlin; popular agent-graph frameworks are Python-first.<br/>Hand-written: native, no extra interpreter | a while loop + a switch | one-language stack traces | no dependencies | nothing for free.<br/>Framework: embedded Python or bindings | layers per step | framework internals in the trace | a large, fast-moving dependency tree | checkpoints, streaming, interrupts provided.<br/>Deciding fact: this graph is small and stable. Borrow the concepts (named nodes, explicit state, conditional edges, step limit) so a later port is mechanical.</div></div></foreignObject><rect x="655" y="622" width="595" height="128" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="655" y="622" width="595" height="128"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:595px;height:128px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">WHY THREE AGENTS, NOT ONE<br/>- Separation: the planner decides what to do; the specialists only do.<br/>- Different model needs: planning wants the stronger tier; seeing and tapping want the fast one.<br/>- Per-node settings: each node has its own temperature, output cap and tool list.<br/>- Smaller prompts: each specialist sees only its own tools, so fewer tokens and fewer wrong-tool errors.<br/>Cost: every specialist turn costs one more orchestrator call. Hub-and-spoke: specialists never talk to each other.</div></div></foreignObject><rect x="30" y="764" width="1220" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="764" width="1220" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:36px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend:  green = node that calls the model  |  dashed white = plain code, no model  |  red = terminal decision  |  blue = shared state  |  solid arrow = router choice  |  dashed arrow = control returns to the orchestrator after EVERY specialist turn</div></div></foreignObject><rect x="30" y="814" width="1220" height="108" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="814" width="1220" height="108"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:108px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Numbers are loaded from ../constants.json by key (shown). P = public (cited doc/paper, value as published); I = illustrative (round value chosen to explain the idea, never a measurement); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/02-the-agent-graph.md (nodes, router, state, step limit, framework comparison, three agents); notes/03-the-orchestrator.md (tier, temperature, output cap, stop on evidence); notes/05-the-actuator.md (actuator tools, OS route). Vocabulary (StateGraph, conditional edges, START/END, recursion limit): LangGraph Graph API docs, https://docs.langchain.com/oss/python/langgraph/graph-api (public).<br/>[I1] orchestrator_temperature_illustrative = 0.2. illustrative low non-zero temperature for the planner<br/>[I2] specialist_temperature_illustrative = 0. illustrative: deterministic-as-possible specialists<br/>[I3] max_output_tokens_illustrative = {orchestrator: 4000, vision: 4000, actuator: 2000} tokens per reply. illustrative per-node reply caps<br/>[I4] actuator_vs_screen_illustrative = {screen_calls: 2, screen_s: 10, os_calls: 1, os_s: 2} model calls / s. illustrative comparison of opening an app via the screen vs via one OS call<br/>[I5] graph_step_limit_illustrative = 10 orchestrator hops. illustrative outer-loop limit</div></div></foreignObject><foreignObject x="450.0" y="247.0" width="70" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">routing<br/>decision</span></div></foreignObject><foreignObject x="670.0" y="140.0" width="60" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#666666;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">vision</span></div></foreignObject><foreignObject x="710.0" y="262.0" width="60" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#b85450;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">FINISH</span></div></foreignObject><foreignObject x="665.0" y="410.0" width="70" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#666666;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">actuator</span></div></foreignObject><foreignObject x="420.0" y="52.0" width="280" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">summary written to state; control returns</span></div></foreignObject><foreignObject x="420.0" y="515.0" width="280" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#82b366;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">summary written to state; control returns</span></div></foreignObject></svg>