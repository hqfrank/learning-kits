<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="884" viewBox="0 0 1280 884"><rect x="0" y="0" width="1280" height="884" fill="#ffffff"/><defs><marker id="arrow_666666" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#666666"/></marker><marker id="arrow_d79b00" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#d79b00"/></marker></defs><polyline points="220.0,114.0 233.0,114.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow_666666)"/><polyline points="423.0,114.0 436.0,114.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow_666666)"/><polyline points="626.0,114.0 639.0,114.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow_666666)"/><polyline points="829.0,114.0 842.0,114.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow_666666)"/><polyline points="1032.0,114.0 1045.0,114.0" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow_666666)"/><polyline points="1140.0,162.0 1140.0,188.0 125.0,188.0 125.0,162.0" fill="none" stroke="#666666" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_666666)"/><polyline points="290.0,354.4 400.0,354.4" fill="none" stroke="#d79b00" stroke-width="2.2" marker-end="url(#arrow_d79b00)"/><rect x="20" y="12" width="1240" height="34" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="20" y="12" width="1240" height="34"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1240px;height:34px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:17px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">The model taps in its 1280×800 [P1] reference frame, the device taps in its own pixels: a consistent offset means the scaler is wrong, not the model</div></div></foreignObject><rect x="30" y="66" width="190" height="96" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="30" y="66" width="190" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">1  CAPTURE<br/>the OS screen-capture API<br/>(MediaProjection); the user<br/>consents before capture</div></div></foreignObject><rect x="233" y="66" width="190" height="96" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="233" y="66" width="190" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">2  SCALE DOWN<br/>to the reference frame<br/>1280×800 [P1]<br/>(advice: not above 1920×1080 [P2])</div></div></foreignObject><rect x="436" y="66" width="190" height="96" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><foreignObject x="436" y="66" width="190" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">3  DECIDE  (model call)<br/>returns left_click at<br/>(200, 560) [I4]<br/>in reference px</div></div></foreignObject><rect x="639" y="66" width="190" height="96" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="639" y="66" width="190" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">4  SCALE UP<br/>the coordinate scaler maps it<br/>to (375, 1120) [calc]<br/>in device px</div></div></foreignObject><rect x="842" y="66" width="190" height="96" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="842" y="66" width="190" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">5  ACT<br/>the accessibility service<br/>injects the tap<br/>(dispatchGesture)</div></div></foreignObject><rect x="1045" y="66" width="190" height="96" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="1045" y="66" width="190" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:190px;height:96px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">6  SETTLE<br/>wait 1 s [I5] so the UI<br/>stops moving, then<br/>capture again</div></div></foreignObject><rect x="40" y="214" width="820" height="40" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="40" y="214" width="820" height="40"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:820px;height:40px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Both frames drawn to the SAME scale. Different aspect ratios (3:2 vs 8:5 (= 16:10)) mean the x and y scale factors differ.</div></div></foreignObject><rect x="60" y="268" width="230" height="144" rx="0" fill="#eef8ec" stroke="#82b366" stroke-width="1.5"/><foreignObject x="60" y="268" width="230" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:230px;height:144px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">REFERENCE FRAME<br/>(what the model sees)<br/>1280×800 [P1]</div></div></foreignObject><rect x="400" y="268" width="432" height="288" rx="0" fill="#eef4fc" stroke="#6c8ebf" stroke-width="1.5"/><foreignObject x="400" y="268" width="432" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:432px;height:288px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:center;overflow:hidden;"><div style="width:100%;">DEVICE NATIVE SCREEN<br/>(where the tap happens)<br/>2400×1600 [I3]</div></div></foreignObject><rect x="89" y="362" width="14" height="14" rx="7" fill="#82b366" stroke="#3d6b2a" stroke-width="1.5"/><rect x="106" y="359" width="120" height="20" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="106" y="359" width="120" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:120px;height:20px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#3d6b2a;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">(200, 560) [I4]</div></div></foreignObject><rect x="460" y="463" width="14" height="14" rx="7" fill="#6c8ebf" stroke="#2c4a7a" stroke-width="1.5"/><rect x="478" y="460" width="160" height="20" rx="0" fill="none" stroke="none" stroke-width="1.5"/><foreignObject x="478" y="460" width="160" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:160px;height:20px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:bold;color:#2c4a7a;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">(375, 1120) [calc]</div></div></foreignObject><rect x="880" y="214" width="370" height="270" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/><foreignObject x="880" y="214" width="370" height="270"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:370px;height:270px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">THE SCALER ARITHMETIC  [calc]<br/>x scale = reference ÷ native = 1280 ÷ 2400 = 0.533<br/>y scale = 800 ÷ 1600 = 0.5<br/>device tap = (200 ÷ 0.533, 560 ÷ 0.5) = (375, 1120)<br/><br/>The two scales differ because 3:2 ≠ 8:5 (= 16:10). A plain resize therefore STRETCHES the image. Vendor advice: preserve the aspect ratio when resizing.<br/><br/>Uniform alternative: one scale = min(0.533, 0.5) = 0.5, giving a 1200×800 image padded to 1280×800.<br/><br/>Either way: keep the factors, and apply their inverse to EVERY coordinate the model returns.</div></div></foreignObject><rect x="30" y="572" width="610" height="100" rx="8" fill="#fff7f7" stroke="#b85450" stroke-width="1.5"/><foreignObject x="30" y="572" width="610" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:610px;height:100px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">DIAGNOSE A WRONG TAP<br/>- Consistent offset in one direction: almost always a scaling bug (coordinates applied to a display of a different size). Check the scaler before the prompt.<br/>- Near-miss on a small target: detail lost in down-scaling. Use the zoom action, or crop; not more prompt text.<br/>- Similar-looking wrong element: a more specific instruction, placed BEFORE the image in the message.</div></div></foreignObject><rect x="655" y="572" width="595" height="100" rx="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5"/><foreignObject x="655" y="572" width="595" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:595px;height:100px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">KNOBS AND THEIR TRADE<br/>- Reference frame size: smaller = fewer image tokens and a faster reply; larger = small text stays readable. zoom inspects one region at full resolution.<br/>- Settle delay 1 s [I5]: too short = a half-drawn screen and a repeated action; too long = every step pays the wait.<br/>- Screenshot history: 1 000-1 800 input tokens per screenshot [P6]; keep the last 3 [P7] (diagram 05).</div></div></foreignObject><rect x="30" y="687" width="1220" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><foreignObject x="30" y="687" width="1220" height="36"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:36px;display:flex;align-items:center;font-family:Helvetica,Arial,sans-serif;font-size:11px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Legend:  blue = device code  |  amber = the scaler, where most tap bugs live  |  green = the model call  |  green dot = point the model asked for (reference px)  |  blue dot = where the device taps (native px)  |  arrows: one action cycle; the dashed return is the next observation (diagram 04)</div></div></foreignObject><rect x="30" y="736" width="1220" height="132" rx="0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><foreignObject x="30" y="736" width="1220" height="132"><div xmlns="http://www.w3.org/1999/xhtml" style="box-sizing:border-box;width:1220px;height:132px;display:flex;align-items:flex-start;font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#000000;padding:6px;line-height:1.2;text-align:left;overflow:hidden;"><div style="width:100%;">Sources. Numbers are loaded from ../constants.json by key (shown). P = public (cited doc/paper, value as published); I = illustrative (round value chosen to explain the idea, never a measurement); [calc] = my arithmetic on tagged values.<br/>Mechanism: notes/04-the-vision-specialist.md (five-step cycle, worked scaling example, grounding errors, knobs). Public docs: computer-use tool documentation, sections &#x27;Available actions&#x27;, &#x27;Size screenshots to fit image limits&#x27;, &#x27;Diagnose click issues&#x27;, &#x27;Manage screenshot history&#x27;, &#x27;Optimize model performance with prompting&#x27;; Android MediaProjection guide and AccessibilityService.dispatchGesture reference (see ../SOURCES.md).<br/>[P1] cu_reference_frame_recommended = [1280, 800] px (width, height). public: Anthropic computer-use tool documentation, &#x27;Size screenshots to fit image limits&#x27; (recommended for web applications)<br/>[P2] cu_max_resolution_advised = [1920, 1080] px. public: Anthropic computer-use tool documentation, &#x27;Size screenshots to fit image limits&#x27; (avoid higher)<br/>[I3] device_native_resolution_illustrative = [2400, 1600] px. illustrative tablet screen, chosen with a different aspect ratio from the reference frame<br/>[I4] model_click_illustrative = [200, 560] px in reference frame. illustrative tap request; maps to (375, 1120) device px by my arithmetic<br/>[I5] settle_delay_illustrative = 1 s. illustrative wait after an action before the next screenshot<br/>[P6] cu_tokens_per_screenshot = [1000, 1800] input tokens. public: Anthropic computer-use tool documentation, &#x27;Manage screenshot history&#x27;<br/>[P7] cu_screenshots_kept = 3 screenshots. public: Anthropic computer-use tool documentation, &#x27;Manage screenshot history&#x27; (suggested default)</div></div></foreignObject><foreignObject x="570.0" y="178.0" width="120" height="20"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:normal;color:#666666;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">next observation</span></div></foreignObject><foreignObject x="307.0" y="304.0" width="70" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:bold;color:#d79b00;text-align:center;line-height:1.15;"><span style="background:rgba(255,255,255,0.92);">scaler<br/>x ÷ 0.533<br/>y ÷ 0.5</span></div></foreignObject></svg>